app: cmux-gtk
title: Browser CLI and snapshot worker ownership
space: cmux-gtk
slug: browser-cli-workers
summary: Public agent-browser CLI response validation, bounded worker execution and outstanding synchronous lifecycle paths.
kind: agent_context
source_format: agent_context
source_ref: src/browser/cli.rs
labels: [linux, gtk, browser, lifecycle, observability]
content:
  purpose: BrowserManager owns a unique external daemon session. Worker CLI execution, response decoding and snapshot formatting release GTK model borrows before I/O. This documents existing implementation, not deferred agent feature parity.
  workflows:
    - name: Public CLI execution
      description: src/browser/cli.rs run uses session and JSON arguments, null stdin, four-MiB stdout, 64-KiB stderr and a fifteen-second overall deadline. execute drains both pipes and waits concurrently; failure kills and reaps the direct child. Cancellation uses Tokio kill-on-drop. Descendant browser daemon ownership remains with BrowserManager.
    - name: Response decoding
      description: Reject unsuccessful child status before JSON parsing, reject oversized captured pipes, require an object response and reject non-boolean explicit success values or success false. Missing success retains raw-object compatibility. Move data out of the envelope, including explicit null; otherwise return the complete object. Errors do not expose raw stdout or stderr.
    - name: Navigation
      description: History and explicit URL entry share one admission slot, ordered commands and address refresh. Overlap rejects rather than retaining an unbounded queue. Widget destruction and manager shutdown cancel owned navigation. Initial startup and mapped-tab navigation still use synchronous paths.
    - name: DevTools snapshot
      description: BrowserManager snapshot_async uses the bounded asynchronous socket exchange and a two-operation limit spanning exchange and formatting. A blocking formatter moves textual data or result fields without cloning and uses compact JSON for structured fallback. The permit stays with an already running formatter on cancellation. GTK receives only display text; destroying the overlay label aborts the waiting worker. Activity diagnostics record outcomes but do not yet propagate trace identity through the external daemon.
  safety:
    - ensure_daemon and run_cli still use synchronous Command output with unbounded pipe collection; decoder size rejection does not bound that earlier capture. Startup probing and sleeps still block GTK callers. Migrate lifecycle ownership across UI and socket callers before claiming completion.
    - Do not hold AppState borrows while waiting for worker results or retain closed widgets through callbacks.
    - Transport framing bounds asynchronous socket responses to four MiB with a five-second deadline and sixteen active exchanges.
    - Runtime verification belongs to GitHub Actions; do not run tests locally.
