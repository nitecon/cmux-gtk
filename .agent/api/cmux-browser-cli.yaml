app: cmux-gtk
title: Browser CLI and snapshot worker ownership
space: cmux-gtk
slug: browser-cli-workers
summary: Public agent-browser CLI and socket adaptation, bounded workers, lifecycle ownership and real-browser verification.
kind: agent_context
source_format: agent_context
source_ref: src/browser/cli.rs
labels: [linux, gtk, browser, lifecycle, observability]
content:
  purpose: BrowserManager owns a unique external daemon session. Worker CLI execution, response decoding and snapshot formatting release GTK model borrows before I/O. This documents existing implementation, not deferred agent feature parity.
  workflows:
    - name: Browser address normalization
      description: Shared browser_address.normalize preserves explicit URI schemes including about/data/blob and converts absolute Unix paths into percent-encoded file URLs without filesystem access. Bare hosts retain HTTPS default. Used by CLI open/goto, RPC open and the GTK address entry. Actions lifecycle fixture asserts actual navigate payloads for about:blank and a filename with spaces/hash/question mark while preserving focus. This establishes transport behavior. The optimized real-browser benchmark now also exercises a local HTML filename with reserved URL characters, relative classic script and stylesheet, DOM snapshot, preview frame delivery and back/forward navigation while retaining terminal focus; execution is pending in Actions. Cross-file JavaScript fetch access remains unverified. The external browser configuration controls allow-file-access; normalization does not change that policy.
    - name: Public CLI execution
      description: src/browser/cli.rs run uses session and JSON arguments, null stdin, four-MiB stdout, 64-KiB stderr and a fifteen-second overall deadline. shared task.run_output drains both pipes and waits concurrently; failure kills and reaps the direct child. Cancellation uses Tokio kill-on-drop. Descendant browser daemon ownership remains with BrowserManager.
    - name: Response decoding
      description: Reject unsuccessful child status before JSON parsing, reject oversized captured pipes, require an object response and reject non-boolean explicit success values or success false. Missing success retains raw-object compatibility. Move data out of the envelope, including explicit null; otherwise return the complete object. Errors do not expose raw stdout or stderr.
    - name: Socket parameter adaptation
      description: Existing handler action aliases map eval/goto/gethtml to evaluate/navigate/innerhtml. BrowserManager command_request maps click/fill target to selector, fill text to value, snapshot max_depth to maxDepth and wait timeout_ms/load_state to timeout/loadState. Explicit daemon fields win. A URL substring wait uses a JSON-escaped location.href.includes expression unless an explicit function is supplied.
    - name: Daemon exchange correlation
      description: RPC, startup, snapshot and shutdown exchanges create a daemon_exchange child activity linked to the originating trace. browser.transport.request records the child, parent and a validated generated cmux-UUID wire request identity without action parameters. Completion distinguishes success, error, timeout, overload and cancellation. Physical input and motion retain aggregate counters without per-event traces. Timing covers local transport through response validation; external browser internal execution is not profiled.
    - name: Socket response validation
      description: Preserve object response envelopes for existing callers, allowing absent success for legacy peers. Reject explicit success false, non-boolean success and non-object responses so backend errors cannot become successful outer cmux replies. Do not expose backend error payloads in transport errors.
    - name: Real browser evidence
      description: CI installs agent-browser 0.31.1 independently with Node 24 and Chromium support, then uses the optimized app against a fixture-owned HTTP page. Require actual DOM mutations, snapshots, URL waiting, non-focus behavior, assigned GTK preview textures and CLI failure for a rejected evaluation. Record tool version, browser user agent, raw timing and app resources. This does not add deferred session resume or additional agent feature families.
    - name: Wait and startup deadlines
      description: Shared browser_timeout.wait_budgets grants explicit browser waits their requested duration plus five seconds at daemon transport and another five at the CLI response boundary. Convert milliseconds before adding margins to avoid u64 overflow. Other daemon exchanges keep five seconds. CLI browser open allows thirty seconds for cold startup and its sequential bounded stages; caller cancellation still tears down owned work.
    - name: Navigation
      description: History and explicit URL entry share one admission slot, ordered commands and address refresh within one fifteen-second sequence deadline. Expiration cancels the current CLI child, releases admission and records browser.navigation.timeout with trace identity and budget. Overlap rejects rather than retaining an unbounded queue. Widget destruction and manager shutdown cancel owned navigation. Mapped-tab navigation has a separate latest-destination worker sharing the same admission slot.
    - name: Mapped tab selection
      description: The manager owns one watch channel and one mapped-navigation worker. Rapid selections overwrite the pending destination. After acquiring the shared navigation slot, the worker reads the newest destination and checks its weak visibility token before running bounded public CLI open. GTK map callbacks defer reentrant model borrows with weak state and entry references; unmap clears visibility. Manager teardown aborts the worker and active child. An already running open completes before the newest pending selection is applied; there is no rollback of a command already delivered. This path requires an initialized manager.
    - name: GTK preview startup
      description: The browser-open action discovers executables on a blocking worker and runs public CLI open plus optional stream enable on Tokio, within one fifteen-second deadline. It shares navigation admission and manager shutdown cancellation. CLI pipes and direct-child lifetime use the common bounded executor. The completion installs the resolved executable only into the same manager session and adds the pane to the workspace captured before startup, or discards a stale result. Stream-enable failure remains best effort for compatibility; connecting the advertised stream port remains a separate check. Blocking discovery cannot be interrupted once started.
    - name: Existing saved browser tabs
      description: Saved browser surfaces retain their GTK UUID and short reference. Mapping an uninitialized surface lazily creates its own private BrowserManager through serialized restoration admission. Hidden unvisited surfaces launch no browser process. Widget removal cancels waiting work, and completion checks the same surface and manager identity before installing the executable and stream. Existing live pages retain DOM and history across tab selection. Agent commands initialize a suspended target through the same worker before dispatching against its exact UUID, without selecting the page. Caller cancellation retires unfinished startup while retaining the pane reference for retries. Restore admission waits at most fifteen seconds before the bounded startup transaction. Concurrent initialization is not joined; overlapping commands can fail until the original startup completes.
    - name: Initial viewport allocation
      description: The post-layout callback weakly references the preview and submits set viewport on Tokio through shared CLI admission and deadline handling. Non-positive sizes spawn no child; viewport-only commands do not issue get url. Destruction cancels and reaps worker execution through widget_task_result, shared with navigation and DevTools result delivery. An ownership guard also aborts the worker and disconnects its weak notification when the result future is dropped, including before its first poll. This preserves the initial allocation behavior; continuous resize tracking is not implemented, and overlapping commands can reject under the existing admission policy.
    - name: Ordered preview input
      description: GTK click, wheel and key callbacks enqueue to one lazily owned InputQueue per manager. Its 64 slots hold queued batches and reserved key releases; one batch executes at a time through bounded asynchronous transport. Click press/release share one admission decision. First physical key-down requires two slots, one retained as an OwnedPermit for key-up; repeats use ordinary capacity. Focus loss sends reserved releases with fresh identities and without text, deferring reentrant model borrows and checking manager identity. Manager shutdown/drop aborts its input worker. Overload and exchange failures emit metadata-only events. Pointer motion remains a separate coalesced stream; navigation is not serialized with this queue, so slow-daemon backlog and stale input across navigation still require validation.
    - name: Browser RPC delivery
      description: BrowserAction and BrowserStreamDisable prepare owned exchanges under a short GTK borrow, then share spawn_browser_exchange on Tokio. The helper preserves request identity and endpoint error codes, selects caller-response cancellation before exchange completion, and records browser.rpc.complete with the inherited trace identity and duration. Stream disable uses stream_error and reports missing manager/runtime without spawning work. Browser open and stream enable use the separate bounded startup transaction and GTK completion adapter.
    - name: Socket lifecycle startup
      description: BrowserOpen and BrowserStreamEnable share startup_async with GTK preview startup. The single fifteen-second transaction owns navigation admission, worker discovery, async readiness probing and bounded CLI/private-daemon exchanges. Ready daemons are reused without blank navigation; open resolves an explicit workspace UUID locally before startup and removes that local selector from daemon parameters and best-effort stream enabling. StartupError preserves daemon_error, browser_error and stream_error. Caller cancellation aborts the owned worker. GTK completion checks the original manager session and captured workspace (explicit or active), moves the response when adding surface references, and creates/wires a browser tab without selecting it or grabbing keyboard focus. A response does not roll back an external mutation if a workspace closes meanwhile; stream attachment remains best effort.
    - name: Stream metadata
      description: start_stream replaces the owned frame task and schedules metadata loading on Tokio filesystem workers. The read accepts at most 64 bytes and a nonzero u16 port, has a five-second caller deadline, and cancels its awaiting future when the delivery receiver closes or the manager drops/replaces the task. Invalid, missing and timed-out advertisements emit browser.activity.complete outcomes with stage stream_metadata without file contents; New-widget RPC attachment inherits the operation trace, as do UI startup and saved-tab restoration. browser.stream.connect includes the same trace, outcome and duration_ms. Streaming state means attachment scheduled, not connected. A separate five-second WebSocket connection deadline follows metadata loading. Already-started Tokio filesystem operations can outlive future cancellation; pathological blocked filesystem operations are not forcibly interrupted.
    - name: Browser shutdown
      description: Removing a manager synchronously closes navigation admission, signals cancellation and aborts its frame reader. The owned close future waits at most one second for admission release before the bounded five-second async socket exchange. UI close and application shutdown share AppState shutdown_browser, which retains tasks in a JoinSet and reaps completed tasks on subsequent closes. After GTK exits, main drains outstanding close tasks for at most seven seconds before cancelling Tokio; deadline expiry aborts the remaining tasks. A response_received outcome establishes a JSON response, not confirmed daemon process termination. Missing runtime and drain/task failures are diagnostic events.
    - name: DevTools snapshot
      description: BrowserManager snapshot_async uses the bounded asynchronous socket exchange and a two-operation limit spanning exchange and formatting. A blocking formatter moves textual data or result fields without cloning and uses compact JSON for structured fallback. The permit stays with an already running formatter on cancellation. GTK receives only display text; destroying the overlay label aborts the waiting worker. Activity diagnostics record outcomes but do not yet propagate trace identity through the external daemon.
  safety:
    - Execution failures emit browser.cli.failed with trace ID, fixed stage, I/O error kind and nullable OS error code, excluding paths, arguments and pipe contents.
    - Failed public CLI subprocesses use shared direct-child cleanup with no grace and a five-second reap budget. Preserve the original command error and record browser.cli.cleanup_failed if reaping fails. kill_on_drop remains enabled; OS-stuck children may outlive the userspace wait.
    - Synchronous ensure_daemon, run_cli and send_command paths are removed. Stream metadata now runs off GTK; result application and filesystem cancellation limitations still need lifecycle and responsiveness validation; browser-daemon restart and navigation/input interaction are not fully verified.
    - Do not hold AppState borrows while waiting for worker results or retain closed widgets through callbacks.
    - Transport framing bounds asynchronous socket responses to four MiB with a five-second default deadline (explicit waits include their requested duration and margin) and sixteen active exchanges.
    - Runtime verification belongs to GitHub Actions; do not run tests locally.

  surface_ownership:
    - Every successful browser open creates a distinct GTK surface and private daemon session, preserving other pages and terminal focus.
    - Commands resolve short references or live GTK UUIDs locally and omit backend surface selectors. An omitted target selects the active browser or sole live browser; ambiguity fails explicitly.
    - Browser list enumerates actual GTK surfaces with workspace UUID, saved URL and connected, starting or suspended state.
    - Explicit close removes only that surface and then retires its private manager; close without a selector attempts all browser surfaces, including suspended ones. The keyboard close action shares the same model operation. The final surface of a workspace follows the ordinary close policy and cannot be removed; rejection preserves its session and returns close_failed, while earlier successful closes remain applied.
    - Successful daemon results carrying data.url update only the original surviving surface and schedule session persistence. Navigation lacking URL metadata and page-driven changes still require reconciliation.
    - Startup cancellation owns provisional daemon retirement; window shutdown drains all installed and provisional sessions through shared bounded close tasks.
    - Independent real-page DOM, history, target isolation and close survival are covered by the Actions browser benchmark. Aggregate browser-process memory and resident-page admission remain separate verification gaps.
