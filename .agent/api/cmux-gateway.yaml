app: cmux-gtk
title: Interactive gateway session and task delivery
space: cmux-gtk
slug: gateway-execution
summary: One global lifecycle stream, exact agent-session provenance and approved peer broadcasts with durable recipient fences.
kind: agent_context
source_format: agent_context
source_ref: src/gateway/mod.rs
version: native-terminal-input
labels: [linux, windows, gtk, gateway, websocket, injection]
content:
  windows_executor: Native Windows process observation remains separate from SDK identity. V2 task provenance and local registration require no Codex installation-path or executor-role allowlist.
  purpose: Gateway broadcasts deterministic lifecycle events; CMUX routes them to running local project applications. Harness AGENTS.md/CLAUDE.md owns task selection and coordination. No provider launcher, scheduler, hooks or enrollment is introduced.
  configuration: Preferences -> Agent Gateway has enabled, base address, API key and explicit global experimental injection_approved. Upgrade preserves connection settings and instance ID but defaults consent to false. Changing endpoint creates a new consumer and clears the old endpoint journal; changing credentials, disabling or revoking approval retires queued messages.
  contract: Requires agent-gateway v1.19.0+, published agent-gateway-task-stream contract at .agent/api/task-stream.yaml in nitecon/agent-gateway. Use one native Authorization Bearer WebSocket GET /v1/tasks/stream for all projects. First frame is subscribe protocol_version 1, stable consumer_id and nullable after_event_id. First opt-in starts at tail. subscribed validates protocol/consumer/cursor before events are accepted.
  metadata: GET /v1/projects returns an array of project records with ident and nullable canonical_remote. Refresh every 30 seconds. With injection approved, verified active local Git remotes lacking a mapping automatically use idempotent POST /v1/projects with ident set to the normalized remote and repo_url to its HTTPS form. The gateway derives the project identity and fills empty mappings; CMUX rereads authoritative projects before matching. Registration attempts are limited to one repository per tick and once every 30 seconds per repository. Existing conflicting mappings and ambiguous matches never authorize input. Metadata HTTP failures keep the live connection and retry. Notifications use only lifecycle kind and task ID, including truncated events. CMUX never fetches task descriptions, specifications or comment bodies for injection. The receiving agent uses agent-tools to retrieve current authoritative task context when needed.
  metadata_retry: Fresh events with missing or conflicting cached repository metadata retain received status and their arrival-time process candidates, with a visible automatic-retry reason and any metadata error. They retry while connected, without blocking other projects, until metadata validates or the five-minute event age expires. Only the original surviving process attachments may receive input. Process replacement, consent changes, connection loss and restart retire pending events; skipped and uncertain receipts remain nonreplayable. Null historical event remotes can resolve against repaired current project metadata without creating another task or editing local configuration.
  credentials: Environment CMUX_GATEWAY_API_KEY then GATEWAY_API_KEY take precedence at startup, otherwise owner-only gateway-key beside config.toml. Bearer headers authorize REST and native upgrade; no query keys, cookies or redirects. Keys are redacted before event persistence and terminal input. Status and session snapshots contain no credentials. Base addresses require TLS outside exact loopback and reject credentials, query strings and fragments.
  matching: Local CWD and Git upstream/origin match one project. Local Git remotes and gateway canonical remotes share one normalizer that lowercases repository host and path before matching and removes the .git suffix. Missing canonical remotes do not establish a match. Native OS process inspection identifies the running foreground app independently of its UI or provider. Pin PID/start time, workspace, surface and repository; remote or ambiguous workspaces are excluded. Shell-only terminals receive no gateway input.
  session_identity: SDK deterministic project/Git/provider/OS registration and positive numbered sessions remain independent of native terminal membership. Native recipient UUIDs identify process generations. No logical actor attachment is guessed by provider/project; old claims require rightful handoff.
  terminal_membership: Synthetic prompts, enrollment tokens, hook capabilities and managed-provider attachment are absent. Kernel-authenticated registration announce/resolve validates and echoes unbound metadata. Ordinary task mutations do not depend on membership. Existing exact-origin checks remain where identity is known.
  endpoint_discovery: Linux uses the existing private local socket/marker and Windows uses the owner-secured named pipe. SDK task registration works independently of CMUX being installed or reachable. Removing the enrollment path does not require copied UUIDs, provider flags, hook installation or user configuration changes.
  provenance: Gateway events optionally carry origin {session_id,instance_id,provider,os}. Validate present origins for exact-origin suppression; missing legacy provenance remains unknown and is never guessed from comment author or task owner. Completion origin is its mutation actor, independent of latest comment author; gateway preserves causative worker origin through delegated source mirrors. Session-aware canonical ownership is gateway task.owner_origin.
  readiness: Human text, clipboard, arrows, Enter, IME and command menus remain owned by the native terminal application. CMUX has no separate bottom editor. Gateway messages wait in the existing bounded queue for a recognized empty native input prompt, using a bounded current-screen grid with caret and style metadata. Busy work, model menus, permission dialogs, multiline drafts and unknown layouts defer delivery until the existing five-minute expiry. GTK checks the prompt and human input generation again immediately before literal paste plus native Enter. No provider launcher, managed model thread, enrollment prompt or extra per-project configuration is introduced.
  delivery: The gateway worker owns one bounded FIFO per native recipient. Human input goes directly through Ghostty and never enters a CMUX editor or draft history. A bounded platform worker reverifies process identity; GTK repeats exact target, input generation, empty native prompt, consent and freshness checks before a synchronous literal paste/native Enter pair. Windows completes the text boundary with native End before Return. Interrupted submissions remain uncertain and never replay automatically. Input submission is distinct from confirmed model receipt or task completion.
  presentation: Gateway input is a compact task-ID line wrapped in <Gateway message> and </Gateway message>. No task/comment body, provenance header or acknowledgment instruction is injected. Process output and its cursor/scrollback remain application-owned. Read-text/read-scrollback return native text with input null because no separate CMUX composer exists. Session context retains composer_active false and cmux_input_queue as the gateway delivery transport; no logical actor attachment is inferred.
  loops: User/agent/system comments and completions remain compact peer notifications. Suppress only exact origin session plus instance, never author name, whole CMUX instance, provider or OS. Delivery acknowledgments do not create task comments. Completion notifications do not assign new work; harness instructions govern claims and responses.
  persistence: gateway.json stores one event cursor and separate event-plus-session recipient fences. Persist received snapshots and candidates before promptly acknowledging receipt. Fsync each submitting fence before GTK input; interrupted submissions become uncertain independently and never replay automatically. Aggregate protocol-v1 ACK remains received/queued until all recipients finish, then reports terminal outcome and bounded JSON recipient detail in its existing summary string. Replayed IDs reconcile existing recipient outcomes. Prune only fully terminal confirmed event groups; historical pruned events at/below cursor stay nonreplayable. Received/queued events retire as skipped on connection loss or app restart; submitting events remain uncertain after restart. Nothing queued offline is replayed or retargeted.
  connection: One owned socket closes on settings change or shutdown and reconnects after five seconds. Client heartbeat every 10 seconds and on server heartbeat, checked between bounded metadata/delivery operations; heartbeat_ack is never echoed. Incoming silence is bounded to 60 seconds, subscription to 10 seconds and socket writes to five seconds. subscribed.latest_event_id defines the reconnect backlog boundary; existing events at or below it are acknowledged as skipped without injection. Event created_at is Unix milliseconds and must be present and no older than five minutes at receipt, routing and final input execution. Matching processes must exist at event arrival; expired queues are skipped even when the executor is unavailable. Frame/message limits are 64 KiB. Storage failure pauses the service before further input.
  limits: Existing bounds remain with 64 pending gateway messages/candidates, 2048 receipts, 48-KiB gateway bodies and bounded transport/storage operations. GTK owns native surface handles and prompt snapshots; platform workers inspect OS processes; Tokio owns transport, FIFO routing and persistence. Native prompt grids are transient and never persisted or returned in credential-free gateway status.
  endpoints:
    - method: gateway.status
      description: Credential-free global settings, connection, project/process/queue counts and per-recipient receipt outcomes/reasons.
    - method: gateway.configure
      description: Requires enabled boolean, base url string and injection_approved boolean. Optional api_key updates the separate private credential. No external event-ingress or synthetic readiness RPC exists.
    - method: gateway.session
      description: Read-only params {surface_id UUID}. Returns native recipient/session identity, unbound membership, process name as provider context, OS, workspace/surface, directory, composer_active and delivery_transport cmux_input_queue. Independent of gateway transport/consent; no logical SDK attachment is inferred.
    - method: gateway.sessions
      description: Read-only params {}. Returns {sessions:[local verified context records]} across local workspaces. Available without gateway connection or injection consent; never creates or selects agents.
    - method: gateway.session.announce
      description: Validates and echoes versioned registration origin/provider_session_id/base_id/session_slot/actor_id/repository with binding_state unbound. Old version1 metadata remains supported. Removed enrollment_token requests reject; no hook, token consumer, prompt input or provider-specific association occurs.
    - method: gateway.session.resolve
      description: Same validated unbound registration echo as announce; no prompt interception or guessed attachment.
  validation: Actions-only native Linux/Windows checks use ordinary official Codex TUIs to open /model, move its real selection with plain Down/Up and retain notifications until Escape closes the menu. They also verify native multiline draft preservation, deferred busy work, peer progress, actual model receipt, process/input generation checks, native key press/release delivery, null metadata recovery and HTTP 503 retry, freshness, reconnect retirement and uncertain fences. Windows packaging checks native ConPTY, visible frames and the portable updater. No destination hardware acceptance is inferred.
