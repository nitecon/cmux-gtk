app: cmux-gtk
title: Interactive gateway session and task delivery
space: cmux-gtk
slug: gateway-execution
summary: Global injection consent and prepared lifecycle routing; the new authenticated stream and hookless readiness adapters remain pending.
kind: agent_context
source_format: agent_context
source_ref: src/gateway/mod.rs
labels: [linux, gtk, gateway, websocket, injection]
content:
  purpose: CMUX owns terminal delivery; gateway owns canonical task lifecycle. Removed manual mappings, assignment acceptance, execution reports and gateway hook reporting. Independent native resume hooks remain intact. No other repository or gateway settings changed.
  configuration: Preferences -> Agent Gateway has enabled, base address, API key and explicit global experimental injection_approved. Upgrade preserves existing connection settings and instance ID but defaults consent to false; old mappings/runs are omitted from new saves. No per-project approval or execution setting exists in CMUX.
  transport_status: The legacy /v1/execution/connect transport is removed. Enabled preferences show Awaiting gateway stream specification. No socket is opened yet. Future transport owns one authenticated connection per instance, supplies Project metadata and normalized Message actions to the serialized worker, and maps local outcomes to the agreed replay/acknowledgment protocol. Internal task Kind/Message names are not an advertised wire schema.
  credentials: Environment CMUX_GATEWAY_API_KEY then GATEWAY_API_KEY take precedence at startup, otherwise owner-only gateway-key beside config.toml. Status and session snapshots contain no credentials. Event bodies redact the current bearer value. Base addresses require TLS outside exact loopback and reject credentials, query strings and fragments.
  matching: Local surface CWD and the current Git branch's upstream remote identify the repository, with origin fallback for untracked branches. SSH/scp and HTTPS URLs normalize host and .git suffix while retaining case-sensitive paths and custom ports. Exactly one project and active recipient must match. Linux procfs verifies Claude/Codex executable or known Node CLI entry point plus PID/start ticks; saved resume state never establishes a live agent. Remote workspaces and incomplete oversized snapshots are excluded.
  preparation_boundary: A reliable hookless provider observer is still required. observe_input is internal GTK ingress for a recent process-bound readiness and gateway actor identity. Nothing currently calls it. Unknown readiness never authorizes input, and no public RPC can fabricate a ready observation or inject a normalized stream event.
  delivery: Created, Commented and Completed messages use a bounded FIFO pinned to the original workspace/surface/process generation/repository. Busy, unfinished and unknown input wait. No-agent or ambiguous events are skipped immediately, never delivered to a later agent. A fresh EmptyReady observation must match process generation and input revision, with no pending clipboard delivery. GTK rechecks consent, process PID, workspace, CWD, readiness and input revision before literal paste plus separate Enter. Busy/input races defer; changed targets retire. No focus change or agent launch occurs.
  presentation: Input is wrapped in <Start Agent Gateway Message Injection> and </Stop AgentGateway Message injection>. A cyan display-only terminal annotation shows the injected text; ANSI styling is not submitted to stdin. Controls and delimiter spoofing are rejected at admission.
  loops: Normalized comments require author IDs and a known recipient actor for that process. Own actor comments and this instance's source events are skipped. Attribution must come from the future adapter/observer rather than inference from terminal text.
  persistence: gateway.json stores instance, global config and bounded receipts only. A submitting receipt is fsynced before input; interrupted submissions load as uncertain and never automatically replay. Already injected/skipped/uncertain event IDs deduplicate after restart. Pending messages are memory-only; durable pending replay and cursor/ack semantics await the gateway spec. Receipt capacity applies backpressure instead of evicting fences. This is at-most-once submission fencing, not a claim of exactly-once distributed delivery or task completion.
  limits: 32 operation/delivery slots, 64 pending messages and candidate terminals, 2048 receipts, 48-KiB message bodies, one-second readiness freshness, eight-MiB journal, two-second bounded Git commands and a five-second scan admission budget. GTK owns handles; Tokio owns the service; blocking workers own procfs and journal I/O. Storage failure pauses delivery.
  endpoints:
    - method: gateway.status
      description: Credential-free global settings, connection preparation status, pending count and delivery receipts.
    - method: gateway.configure
      description: Requires enabled boolean, base url string and injection_approved boolean. Optional api_key updates the separate private credential. Changing gateway/credential, disabling or revoking approval retires queued messages.
  validation: CI unit tests cover lifecycle matching, consent, ambiguity, own comments, duplicates, input freshness, clipboard gates, queue limits, changed processes and durable uncertain receipts. tests/test_linux_gateway.py exercises real GTK preferences RPC/CLI, legacy migration, key permissions and restart persistence. Live stream/reconnect delivery tests will be added once the wire contract exists. Tests run only in GitHub Actions.
