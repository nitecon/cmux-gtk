app: cmux-gtk
title: Interactive gateway session and task delivery
space: cmux-gtk
slug: gateway-execution
summary: One authenticated global lifecycle stream, repository matching and approved hookless input with durable delivery tracking.
kind: agent_context
source_format: agent_context
source_ref: src/gateway/mod.rs
version: v0.6.2
labels: [linux, gtk, gateway, websocket, injection]
content:
  purpose: CMUX owns terminal delivery; gateway owns canonical task lifecycle. No manual mappings, per-project execution policies, assignment dialogs or gateway lifecycle hooks remain. Independent native resume hooks are unchanged.
  configuration: Preferences -> Agent Gateway has enabled, base address, API key and explicit global experimental injection_approved. Upgrade preserves connection settings and instance ID but defaults consent to false. Changing endpoint creates a new consumer and clears the old endpoint journal; changing credentials, disabling or revoking approval retires queued messages.
  contract: Requires agent-gateway v1.19.0+, published agent-gateway-task-stream contract at .agent/api/task-stream.yaml in nitecon/agent-gateway. Use one native Authorization Bearer WebSocket GET /v1/tasks/stream for all projects. First frame is subscribe protocol_version 1, stable consumer_id and nullable after_event_id. First opt-in starts at tail. subscribed validates protocol/consumer/cursor before events are accepted.
  metadata: GET /v1/projects returns an array of project records with ident and nullable canonical_remote. Refresh every 30 seconds. Truncated events fetch flattened task detail through GET /v1/projects/:ident/tasks/:id before input, preserving full task specification or matching comment. Failed/unsafe/oversized context is visibly failed, never silently treated as complete.
  credentials: Environment CMUX_GATEWAY_API_KEY then GATEWAY_API_KEY take precedence at startup, otherwise owner-only gateway-key beside config.toml. Bearer headers authorize REST and native upgrade; no query keys, cookies or redirects. Keys are redacted before event persistence and terminal input. Status and session snapshots contain no credentials. Base addresses require TLS outside exact loopback and reject credentials, query strings and fragments.
  matching: Local surface CWD and current Git branch upstream identify the repository, with origin fallback for untracked branches. Canonical host/path, SSH/scp and HTTPS URLs normalize host and .git while retaining repository case and custom ports. Exactly one project and recipient must match. Linux procfs verifies actual Claude/Codex executable, Claude native .local/share/claude/versions/<version> executable or known Node CLI entry point plus PID/start ticks. Remote workspaces and incomplete oversized snapshots are excluded. Arrival-time identities are persisted before slow repository reads, so a message cannot target a later agent.
  readiness: GTK captures bounded active-screen Ghostty render grids without changing focus or viewport. The worker recognizes a visible provider caret immediately after the prompt marker, a shortcuts footer and blank or faint-placeholder input. Codex shaded composer boundaries come from complete native rows sharing an explicit background; its separate status row is outside editable input, while multiline drafts and attachments inside the composer block delivery. Dialog words in previous replies are excluded for this layout; nearby interrupt indicators still block. Busy/cancel/permission/disabled UI, user drafts and unknown layouts stay queued. Process, input revision and grid must remain stable for at least 500 ms. Final GTK checks repeat native PID, workspace, CWD, input revision, pending clipboard and layout checks. This conservative experimental observer does not guarantee support for every provider version or theme.
  delivery: task_created, task_commented and task_completed events share a durable FIFO pinned to workspace/surface/process generation/repository. Outgoing delegated source tracking tickets are skipped; target normal tasks are assignments. No-agent or ambiguous events skip with a visible reason. Changed targets retire without retargeting. One readiness observation permits one submission. GTK pastes literal text then separately submits Enter; no focus change or agent launch occurs.
  presentation: Input is wrapped in <Start Agent Gateway Message Injection> and </Stop AgentGateway Message injection>. A cyan display-only terminal annotation shows the injected text; ANSI is not submitted to stdin. Terminal controls and delimiter spoofing are rejected. Preferences show connection, project/agent/queue counts and recent receipt explanations.
  loops: Ordinary user, agent and system comments remain eligible. Delivery acknowledgments never create canonical task comments. The injected wrapper explicitly asks the recipient not to post comments solely acknowledging injection. Completion events are notifications, not assignments; canonical progress/outcome and task completion use existing agent-tools APIs.
  persistence: gateway.json stores stable consumer, global config, cursor, received snapshots, pinned candidates/queued payloads and bounded receipt fences. Persist before promptly acknowledging received so busy terminals never block other projects. Fsync submitting before GTK input. Interrupted/lost submissions become uncertain and never automatically replay. recorded confirms actual saved status and advances the durable cursor. Replayed IDs reconcile existing outcomes without typing again. Confirmed terminal receipts may be pruned at capacity; historical IDs at/below cursor without a retained fence become uncertain rather than replaying.
  connection: One owned socket closes on settings change or shutdown and reconnects after five seconds. Client heartbeat every 10 seconds and on server heartbeat, checked between bounded metadata/delivery operations; heartbeat_ack is never echoed. Incoming silence is bounded to 60 seconds, subscription to 10 seconds and socket writes to five seconds. Frame/message limits are 64 KiB. Storage failure pauses the service before further input.
  limits: 32 settings/delivery slots, 64 pending messages and candidate terminals, 2048 receipts, 48-KiB message bodies, one-second observation freshness, eight-MiB private journal, one-MiB REST JSON, 256-KiB native screen capture, two-second bounded Git commands and five-second scan admission budget. GTK owns handles; Tokio owns transport and readiness; blocking workers own procfs and persistence.
  endpoints:
    - method: gateway.status
      description: Credential-free global settings, connection, project/agent/queue counts and receipt outcomes/reasons.
    - method: gateway.configure
      description: Requires enabled boolean, base url string and injection_approved boolean. Optional api_key updates the separate private credential. No external event-ingress or synthetic readiness RPC exists.
  validation: GitHub Actions exercises native Bearer RFC6455/REST with real GTK and compiled native foreground fixtures, first-tail behavior, all lifecycle kinds/comment roles, delegated target/source handling, multi-project busy queues, user drafts, changed executable, no-agent shells, redaction, full-context fetch, heartbeat, replay/cursor reconnect, global approval/migration and uncertain restart. Unit tests exercise routing, readiness, protocol normalization, queue bounds and fsynced delivery fences. Tests run only in Actions.
