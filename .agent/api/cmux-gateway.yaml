app: cmux-gtk
title: Interactive gateway session and task delivery
space: cmux-gtk
slug: gateway-execution
summary: One global lifecycle stream, exact agent-session provenance and approved peer broadcasts with durable recipient fences.
kind: agent_context
source_format: agent_context
source_ref: src/gateway/mod.rs
version: managed-codex-native-queue
labels: [linux, windows, gtk, gateway, websocket, injection]
content:
  windows_executor: Native Windows process observation remains separate from SDK identity. V2 task provenance and local registration require no Codex installation-path or executor-role allowlist.
  purpose: Gateway broadcasts canonical lifecycle events without selecting executors. CMUX owns safe delivery to local project peers. Task selection, platform responsibility, claiming and coordination belong to the user agent harness AGENTS.md/CLAUDE.md. No scheduler or OS/provider task assignment is introduced. User-invoked cmux codex explicitly launches a native TUI with a desktop-owned backend; gateway events never launch agents.
  configuration: Preferences -> Agent Gateway has enabled, base address, API key and explicit global experimental injection_approved. Upgrade preserves connection settings and instance ID but defaults consent to false. Changing endpoint creates a new consumer and clears the old endpoint journal; changing credentials, disabling or revoking approval retires queued messages.
  contract: Requires agent-gateway v1.19.0+, published agent-gateway-task-stream contract at .agent/api/task-stream.yaml in nitecon/agent-gateway. Use one native Authorization Bearer WebSocket GET /v1/tasks/stream for all projects. First frame is subscribe protocol_version 1, stable consumer_id and nullable after_event_id. First opt-in starts at tail. subscribed validates protocol/consumer/cursor before events are accepted.
  metadata: GET /v1/projects returns an array of project records with ident and nullable canonical_remote. Refresh every 30 seconds. Truncated events fetch flattened task detail through GET /v1/projects/:ident/tasks/:id before input, preserving full task specification or matching comment. Failed/unsafe/oversized context is visibly failed, never silently treated as complete.
  credentials: Environment CMUX_GATEWAY_API_KEY then GATEWAY_API_KEY take precedence at startup, otherwise owner-only gateway-key beside config.toml. Bearer headers authorize REST and native upgrade; no query keys, cookies or redirects. Keys are redacted before event persistence and terminal input. Status and session snapshots contain no credentials. Base addresses require TLS outside exact loopback and reject credentials, query strings and fragments.
  matching: Local CWD and Git upstream/origin identify exactly one project. Native Claude/Codex peers are fenced by executable, PID/start ticks, workspace and surface. Remote/ambiguous workspaces are excluded. Ordinary SDK registration may attach only through the managed backend exact conversation and caller-process ownership. All other native terminals retain unbound metadata; no provider/project-only guess substitutes for the removed enrollment mechanism.
  session_identity: Agent-tools owns deterministic project/Git/provider/OS registration with a local positive numbered session. Logical conversation UUID and four gateway origin headers remain independent of CMUX membership. Native conversation metadata and temporary registration need no executor allowlist or prompt hooks. Existing claims made with an earlier identity require legitimate completion or release before client rollout. Managed Codex launch establishes an exact native conversation-to-pane relationship independently of SDK registration.
  terminal_membership: Synthetic identity prompts, tokens, hook capabilities and automatic binding are removed. Local IPC remains kernel authenticated. Registration announce/resolve validates metadata; it correlates only an exact managed Codex conversation from a kernel-authenticated descendant of its known backend. Other callers remain unbound; provider/project-only selection is prohibited. Native session discovery remains read-only and exposes recipient process/surface/workspace metadata, without inventing an SDK actor attachment.
  endpoint_discovery: Linux uses the existing private local socket/marker and Windows uses the owner-secured named pipe. SDK task registration works independently of CMUX being installed or reachable. Removing the enrollment path does not require copied UUIDs, provider flags, hook installation or user configuration changes.
  provenance: Gateway events optionally carry origin {session_id,instance_id,provider,os}. Validate present origins and display attribution; missing legacy provenance remains unknown and is never guessed from comment author or task owner. Completion origin is its mutation actor, independent of latest comment author; gateway preserves causative worker origin through delegated source mirrors. Session-aware canonical ownership is gateway task.owner_origin.
  managed_codex: Explicit cmux codex requires installed Codex0.161+ remote TUI/WebSocket capability authentication/queue APIs. Desktop owns one backend child and exact thread per pane; CLI keeps native TUI and explicitly forwards its options. Kernel caller must belong to the chosen local terminal. Private loopback bearer capability is returned only to launcher, never saved/published. Native queue bypasses composer readiness and preserves drafts; queue acceptance is injected transport outcome with explicit model-receipt-unconfirmed reason. Existing fsynced fences, project matching, consent, FIFO and generation retirement apply; uncertain queue replies never replay. One conversation per launch; conversation switching requires a fresh managed launch. Claude/plain Codex retain existing delivery.
  readiness: GTK captures bounded active-screen Ghostty render grids without changing focus or viewport. The worker recognizes a visible provider caret immediately after the prompt marker, a supported footer and blank or faint-placeholder input. Claude supports the shortcuts hint or the observed auto-mode footer with a closing composer rule; a custom status line below that rule is outside editable input. Codex shaded composer boundaries come from complete native rows sharing an explicit background; its separate status row is outside editable input, while multiline drafts and attachments inside the composer block delivery. Dialog words in previous replies are excluded for this layout; nearby interrupt indicators still block. Busy/cancel/permission/disabled UI, user drafts and unknown layouts stay queued. Process, input revision and grid must remain stable for at least 500 ms. Final GTK checks repeat native PID, workspace, CWD, input revision, pending clipboard and layout checks. This conservative experimental observer does not guarantee support for every provider version or theme.
  delivery: Created/commented/completed events use the existing FIFO for pinned native project peers, busy/draft readiness and durable recipient fences. Only outgoing delegated tracking creation is skipped as a duplicate. Existing exact-origin checks are retained where identity is already known, but no new SDK/native attachment is established or claimed. Changed native targets retire without retargeting; GTK repeats consent/input/process checks before literal task text and Enter.
  presentation: Input is wrapped in <Start Agent Gateway Message Injection> and </Stop AgentGateway Message injection>. The foreground agent owns rendering of submitted input; CMUX does not write annotations into its output stream or alter cursor, screen or scrollback during delivery. Terminal controls and delimiter spoofing are rejected. Preferences show connection, project/agent/queue counts and recent receipt explanations.
  loops: User/agent/system comments and completion results remain peer coordination context. Suppress only exact origin session plus instance, never author name, whole CMUX instance, provider or OS. Delivery acknowledgments do not create task comments. Completion notifications do not assign new work; harness instructions govern claims and responses.
  persistence: gateway.json stores one event cursor and separate event-plus-session recipient fences. Persist received snapshots and candidates before promptly acknowledging receipt. Fsync each submitting fence before GTK input; interrupted submissions become uncertain independently and never replay automatically. Aggregate protocol-v1 ACK remains received/queued until all recipients finish, then reports terminal outcome and bounded JSON recipient detail in its existing summary string. Replayed IDs reconcile existing recipient outcomes. Prune only fully terminal confirmed event groups; historical pruned events at/below cursor stay nonreplayable. Legacy queued recipients lacking session identity retire visibly rather than retargeting.
  connection: One owned socket closes on settings change or shutdown and reconnects after five seconds. Client heartbeat every 10 seconds and on server heartbeat, checked between bounded metadata/delivery operations; heartbeat_ack is never echoed. Incoming silence is bounded to 60 seconds, subscription to 10 seconds and socket writes to five seconds. Frame/message limits are 64 KiB. Storage failure pauses the service before further input.
  limits: 32 settings/delivery slots, 64 pending messages and candidate terminals, 2048 receipts, 48-KiB message bodies, one-second observation freshness, eight-MiB private journal, one-MiB REST JSON, 256-KiB native screen capture, two-second bounded Git commands and five-second scan admission budget. GTK owns handles; Tokio owns transport and readiness; blocking workers own native process inspection and persistence.
  endpoints:
    - method: gateway.status
      description: Credential-free global settings, connection, project/agent/queue counts, receipt outcomes/reasons and managed_codex exact thread/launcher/TUI generation metadata.
    - method: gateway.configure
      description: Requires enabled boolean, base url string and injection_approved boolean. Optional api_key updates the separate private credential. No external event-ingress or synthetic readiness RPC exists.
    - method: gateway.session
      description: Read-only params {surface_id UUID}. Returns native recipient/session identity, binding_state, provider, OS, workspace/surface, directory and delivery_transport/codex_thread_id. Managed metadata is exposed only for the reverified native TUI generation. No logical SDK actor or executor generation is inferred; lookup is independent of gateway transport and readiness.
    - method: gateway.sessions
      description: Read-only params {}. Returns {sessions:[local verified context records]} across local workspaces. Available without gateway connection or injection consent; never creates or selects agents.
    - method: gateway.session.announce
      description: Validates and echoes versioned registration origin/provider_session_id/base_id/session_slot/actor_id/repository with binding_state bound only for the exact known managed conversation and backend-owned caller, otherwise unbound. Old version1 metadata remains supported. Requests carrying removed enrollment_token are rejected; no hook capability, token consumer or terminal input is involved.
    - method: gateway.session.resolve
      description: Same registration metadata echo as announce. Same exact managed conversation correlation as announce; no prompt interception or provider/project-only attachment occurs.
    - method: gateway.codex.start
      description: Explicit launcher params {surface_id, executable absolute path, optional thread_options object with model/sandbox/approvalPolicy strings}. Explicit CLI choices apply at thread creation because native remote resume rejects permission overrides; otherwise existing provider configuration applies. Kernel caller must belong to that local terminal generation. Starts one owned backend/thread and returns endpoint/token/thread_id only to launcher. No gateway consent is needed to launch; event delivery still requires enabled and injection_approved.
    - method: gateway.codex.stop
      description: Params {surface_id}. Only exact launcher PID/generation can retire its backend; pane/launcher/TUI retirement also cancels it automatically.
  validation: GitHub Actions checks registration UUID vectors and unbound metadata echo, native GTK lifecycle delivery, independent busy/draft gating, process replacement, reconnect/replay and uncertain restart. Actual-client regression exercises ordinary tools and confirms even legacy startup-hook announcements cannot cause unsolicited identity input; fixtures never install hooks. Native Windows verifies ordinary registered tools, no enrollment prompts, two native peers, ConPTY/native keys/rendered pixels and portable updater. Real pinned official Codex0.161 native TUI/backend scenarios on Linux/Windows verify two exact conversations, draft-preserving and busy queuing, visible mock-model response and pane retirement. Tests only Actions; no destination hardware/live delivery guarantee is inferred.
