app: cmux-gtk
title: Interactive gateway session and task delivery
space: cmux-gtk
slug: gateway-execution
summary: One global lifecycle stream, exact agent-session provenance and approved peer broadcasts with durable recipient fences.
kind: agent_context
source_format: agent_context
source_ref: src/gateway/mod.rs
version: actor-registration-v2
labels: [linux, windows, gtk, gateway, websocket, injection]
content:
  windows_executor: Native Windows process observation remains separate from SDK identity. V2 task provenance and local registration require no Codex installation-path or executor-role allowlist.
  purpose: Gateway broadcasts canonical lifecycle events without selecting executors. CMUX owns safe delivery to local project peers. Task selection, platform responsibility, claiming and coordination belong to the user agent harness AGENTS.md/CLAUDE.md. No scheduler, OS/provider routing policy or agent launcher is introduced.
  configuration: Preferences -> Agent Gateway has enabled, base address, API key and explicit global experimental injection_approved. Upgrade preserves connection settings and instance ID but defaults consent to false. Changing endpoint creates a new consumer and clears the old endpoint journal; changing credentials, disabling or revoking approval retires queued messages.
  contract: Requires agent-gateway v1.19.0+, published agent-gateway-task-stream contract at .agent/api/task-stream.yaml in nitecon/agent-gateway. Use one native Authorization Bearer WebSocket GET /v1/tasks/stream for all projects. First frame is subscribe protocol_version 1, stable consumer_id and nullable after_event_id. First opt-in starts at tail. subscribed validates protocol/consumer/cursor before events are accepted.
  metadata: GET /v1/projects returns an array of project records with ident and nullable canonical_remote. Refresh every 30 seconds. Truncated events fetch flattened task detail through GET /v1/projects/:ident/tasks/:id before input, preserving full task specification or matching comment. Failed/unsafe/oversized context is visibly failed, never silently treated as complete.
  credentials: Environment CMUX_GATEWAY_API_KEY then GATEWAY_API_KEY take precedence at startup, otherwise owner-only gateway-key beside config.toml. Bearer headers authorize REST and native upgrade; no query keys, cookies or redirects. Keys are redacted before event persistence and terminal input. Status and session snapshots contain no credentials. Base addresses require TLS outside exact loopback and reject credentials, query strings and fragments.
  matching: Local CWD and Git upstream/origin identify exactly one project. All verified local Claude/Codex peers in that project are recipients except the exact originating session and instance. Multiple agents are supported; ambiguous project identities still skip visibly. Process identity uses actual executable, PID and start ticks. Remote workspaces and oversized snapshots are excluded. Arrival-time identities are persisted before slow repository reads; later agents never inherit queued messages.
  session_identity: Agent-tools v1.21.0 owns automatic project registration. Base UUIDv5 uses its existing installation namespace and compact JSON [agent-tools-actor-v2,base,os,canonical Git project path,normalized Git origin,provider]. Logical UUIDv5(base_id, compact JSON [agent-tools-actor-v2,normalized native conversation ID]) stays stable across executor restart/reconnect. A local OS-temp registry allocates a positive session_slot; base_id-number is readable identity, and clearing temp cannot assign another conversation an old UUID. Native conversation metadata selects the caller without process ancestry or executable-role checks. Four gateway provenance headers remain unchanged and task mutations work independently of CMUX membership. OS/provider are context, never assignment policy. V1 clients remain wire-compatible during rollout; their old identities must release or finish existing claims before switching to V2.
  terminal_membership: CMUX keeps native recipient UUID separate from logical registration, fenced by boot, app instance, workspace/surface and foreground PID/start ticks. Local IPC authenticates kernel peer PID through Linux SO_PEERCRED or Windows GetNamedPipeClientProcessId. V2 validates the registered UUID/base/native conversation/positive slot and local OS, without looking for a provider executor or requiring its generation. V1 client requests retain prior validation. Exact native terminal correlation remains required before binding; directory/provider names alone never select a terminal. Read-only peer discovery exposes registered IDs plus base_id/session_slot/actor_id when bound and native recipient_session_id separately; unbound terminals never invent a logical actor.
  automatic_enrollment: An observed current agent-tools SessionStart/UserPromptSubmit hook requests exact-terminal correlation. At a consented stable empty prompt CMUX submits one dedicated cmux-session-enrollment record with envelope version1 and a local one-use 64-hex token. The provider hook consumes and blocks it before the model runs and announces its existing registration. Tokens pin an exact current native recipient for 30 seconds; stale/replayed or conflicting live-terminal bindings reject. Tokens never enter gateway requests, durable journals or diagnostic output. New native conversations renew correlation; V2 executor restart does not change identity or retire a still-current terminal. Generation fences remain on actual terminal delivery. Registration/task mutations require no token, copied UUID, user flags or shell configuration workaround.
  endpoint_discovery: Linux clients use absolute XDG_RUNTIME_DIR/cmux/cmux.sock or /run/user/<realuid>/cmux/cmux.sock and the existing private bounded last-socket-path marker. CMUX_SOCKET/CMUX_SOCKET_PATH are endpoint hints only. Windows uses its owner-secured named pipe. SDK registration supports Linux/macOS/Windows independently of local membership. Matching V2 CMUX must be distributable before promoting SDK v1.21.0; update/restart CMUX then update the client. Ordinary task provenance never depends on the local socket being installed or reachable.
  provenance: Gateway events optionally carry origin {session_id,instance_id,provider,os}. Validate present origins and display attribution; missing legacy provenance remains unknown and is never guessed from comment author or task owner. Completion origin is its mutation actor, independent of latest comment author; gateway preserves causative worker origin through delegated source mirrors. Session-aware canonical ownership is gateway task.owner_origin.
  readiness: GTK captures bounded active-screen Ghostty render grids without changing focus or viewport. The worker recognizes a visible provider caret immediately after the prompt marker, a supported footer and blank or faint-placeholder input. Claude supports the shortcuts hint or the observed auto-mode footer with a closing composer rule; a custom status line below that rule is outside editable input. Codex shaded composer boundaries come from complete native rows sharing an explicit background; its separate status row is outside editable input, while multiline drafts and attachments inside the composer block delivery. Dialog words in previous replies are excluded for this layout; nearby interrupt indicators still block. Busy/cancel/permission/disabled UI, user drafts and unknown layouts stay queued. Process, input revision and grid must remain stable for at least 500 ms. Final GTK checks repeat native PID, workspace, CWD, input revision, pending clipboard and layout checks. This conservative experimental observer does not guarantee support for every provider version or theme.
  delivery: Created/commented/completed lifecycle events broadcast to pinned project peers with a FIFO per recipient. Only outgoing delegated tracking ticket creation is skipped as a duplicate assignment; its useful result comments/completion remain eligible. Exact-origin echoes receive a visible skipped fence; other same-machine/provider peers remain eligible. Busy recipients wait independently while ready peers proceed. Changed targets retire without retargeting. GTK submits literal text then Enter with unchanged readiness and final input checks.
  presentation: Input is wrapped in <Start Agent Gateway Message Injection> and </Stop AgentGateway Message injection>. The foreground agent owns rendering of submitted input; CMUX does not write annotations into its output stream or alter cursor, screen or scrollback during delivery. Terminal controls and delimiter spoofing are rejected. Preferences show connection, project/agent/queue counts and recent receipt explanations.
  loops: User/agent/system comments and completion results remain peer coordination context. Suppress only exact origin session plus instance, never author name, whole CMUX instance, provider or OS. Delivery acknowledgments do not create task comments. Completion notifications do not assign new work; harness instructions govern claims and responses.
  persistence: gateway.json stores one event cursor and separate event-plus-session recipient fences. Persist received snapshots and candidates before promptly acknowledging receipt. Fsync each submitting fence before GTK input; interrupted submissions become uncertain independently and never replay automatically. Aggregate protocol-v1 ACK remains received/queued until all recipients finish, then reports terminal outcome and bounded JSON recipient detail in its existing summary string. Replayed IDs reconcile existing recipient outcomes. Prune only fully terminal confirmed event groups; historical pruned events at/below cursor stay nonreplayable. Legacy queued recipients lacking session identity retire visibly rather than retargeting.
  connection: One owned socket closes on settings change or shutdown and reconnects after five seconds. Client heartbeat every 10 seconds and on server heartbeat, checked between bounded metadata/delivery operations; heartbeat_ack is never echoed. Incoming silence is bounded to 60 seconds, subscription to 10 seconds and socket writes to five seconds. Frame/message limits are 64 KiB. Storage failure pauses the service before further input.
  limits: 32 settings/delivery slots, 64 pending messages and candidate terminals, 2048 receipts, 48-KiB message bodies, one-second observation freshness, eight-MiB private journal, one-MiB REST JSON, 256-KiB native screen capture, two-second bounded Git commands and five-second scan admission budget. GTK owns handles; Tokio owns transport and readiness; blocking workers own native process inspection and persistence.
  endpoints:
    - method: gateway.status
      description: Credential-free global settings, connection, project/agent/queue counts and receipt outcomes/reasons.
    - method: gateway.configure
      description: Requires enabled boolean, base url string and injection_approved boolean. Optional api_key updates the separate private credential. No external event-ingress or synthetic readiness RPC exists.
    - method: gateway.session
      description: Read-only params {surface_id UUID}. Returns logical session_id/instance_id when bound, native recipient_session_id, binding_state, provider, os, surface_id, workspace_id and directory; V2 bound records include version2, provider_session_id, base_id, session_slot and actor_id, while V1 records retain executor_generation. Lookup is independent of transport/readiness; repository may be empty because discovery avoids Git.
    - method: gateway.sessions
      description: Read-only params {}. Returns {sessions:[local verified context records]} across local workspaces. Available without gateway connection or injection consent; never creates or selects agents.
    - method: gateway.session.announce
      description: Accepts version2 origin/provider_session_id/base_id/session_slot/actor_id and optional repository/enrollment_token, or existing version1 requests. V2 uses kernel-authenticated local IPC without executor-role/generation prerequisites. Echoes version, exact origin/native/base/slot/actor_id and binding_state; bound response includes surface_id/workspace_id/recipient_session_id. Registration alone never guesses terminal membership. Optional token must come from the existing exact-terminal prompt hook. Membership errors never change SDK task provenance.
    - method: gateway.session.resolve
      description: Same versioned registration request without token. Echoes caller registration and any existing exact-terminal membership, refreshing readable slot metadata without changing logical identity or authorizing terminal input.
  validation: GitHub Actions covers native GTK project peers, exact-origin comment/completion suppression, foreign OS context, independent busy/draft queues, process replacement, replay/reconnect, recipient fences and uncertain restart. Shared SDK V2 vectors cover registered UUIDs, temporary-slot renumbering and a plain authenticated caller without a provider executor. Actual pinned SDK hooks/tools run below a plain shared host with two conversation registrations, exact-terminal correlation, peer lifecycle events and identity preserved over executor restart. Native Windows builds the same pinned SDK and tests two numbered ConPTY peers, local pipes and peer comment/completion alongside native keyboard and rendered pixels. Tests run only in Actions; fixtures do not claim actual destination provider/hardware acceptance.
