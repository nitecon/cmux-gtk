app: cmux-gtk
title: Terminal resume binding metadata
space: cmux-gtk
slug: terminal-resume
summary: Bounded per-terminal manual resume metadata and checkpoint-conditional cleanup; execution and hook policy remain in progress.
kind: agent_context
source_format: agent_context
source_ref: src/resume.rs
labels: [terminal, session, resume, cli]
content:
  purpose: Store bounded manual resume intent on the owning terminal and prevent stale checkpoint cleanup.
  workflows:
    - name: Register and inspect a binding
      steps:
        - CLI surface resume set accepts --surface UUID, --shell COMMAND, --kind, --checkpoint, --cwd and --name. Surface defaults from CMUX_SURFACE_ID, otherwise to the selected surface.
        - Socket surface.resume.set accepts surface_id (or id), command, name, kind, cwd, checkpoint_id and environment string map. Exact UUID targeting searches all workspaces without selecting them. Browser and stale targets fail.
        - surface.resume.show returns surface_id, workspace_id, resume_binding and auto_resume=false. A missing binding is null. Metadata registration never launches a process.
        - Bindings allow at most 16384 bytes per value, 65536 total bytes and 64 environment entries. NUL bytes and non-shell-variable environment names fail before GTK admission. Restored bindings are validated again.
    - name: Clear without deleting a newer checkpoint
      steps:
        - surface.resume.clear accepts optional checkpoint_id. A mismatch returns conflict and retains the binding. Omission explicitly clears unconditionally.
        - CLI surface resume clear --checkpoint maps to the same operation. Missing explicit targets never fall back to another terminal.
    - name: Persistence and execution boundary
      steps:
        - Bindings live in their terminal entry in the pane layout; normal snapshot/save and final quit drain persist them. New sibling/split terminals start without a binding.
        - This checkpoint implements manual metadata only. Automatic requests return not_supported until a configured hook/approval policy exists. Untrusted source strings do not confer automatic launch authority.
        - Shared RPC diagnostics correlate set/show/clear without logging commands or environment. Launching, provider hooks and lifecycle metrics remain part of the active parity goal.
