app: cmux-gtk
title: Automatic local Git workspace metadata
space: cmux-gtk
slug: workspace-git
summary: Bounded background Git branch and dirty-state discovery without focus or session mutation.
kind: agent_context
source_format: agent_context
source_ref: src/git_metadata.rs
labels: [git, workspace, sidebar, observability]
content:
  purpose: Show the local repository branch and dirty indicator independently of agent-published statuses.
  workflows:
    - name: Automatic local repository observation
      steps:
        - A window-owned GTK listener visits workspaces round-robin with a one-second delay between visits. It resolves each selected terminal's native reported directory, falling back to the explicit workspace launch directory. Remote workspaces are skipped.
        - One Tokio-owned Git status subprocess runs at a time with porcelain v2 branch headers and normal untracked-file reporting. Optional index locks and fsmonitor hooks are disabled; inherited GIT_ overrides are removed. Output is capped at 256 KiB stdout and 4 KiB stderr with a two-second execution deadline and the shared five-second kill/reap cleanup budget.
        - Branch, dirty state, optional upstream/ahead/behind/HEAD and the observed local directory return to GTK. Results for closed workspaces or changed directories are discarded. The dedicated plain-text sidebar label is updated without rebuilding the row, changing focus, retaining filenames or publishing a session save. Workspace list API returns git as null or an object with branch, dirty, upstream, ahead, behind, head and directory. Missing tracking headers yield null counts, not zero. Counts compare locally available refs without fetching. Detached rows show a short commit ID; positive counts show up/down arrows, and the directory appears in the tooltip.
        - Unknown/error/nonrepository results clear the indicator. Observations are transient and re-probed after startup. Poll latency grows with workspace count; this is not a filesystem event watcher.
  operations:
    diagnostics: workspace.git.probe records workspace UUID, elapsed microseconds and repository/error/unavailable outcome without paths, branch names or file content. workspace.git.cleanup_failed records OS error only. Window destruction aborts the listener and its in-flight task; the owned subprocess uses kill-on-drop.
    verification: Actions tests/test_linux_git_metadata.py creates an isolated real repository, checks unborn/changed branches, untracked/tracked dirty state, background updates without focus and directory invalidation via valid local OSC7. The native fixture also checks a local upstream and an ahead commit, with no network access. Rust tests cover porcelain tracking parsing and malformed counts. Strict clippy and fixture syntax pass locally; runtime verification pending.
    outstanding: Remote Git discovery, PR/MR association, project/diff views and user-triggered remote refresh remain parity work.
