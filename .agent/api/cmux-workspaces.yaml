app: cmux-gtk
title: Linux workspace launch and lifecycle
space: cmux-gtk
slug: workspace-launch
summary: GTK workspace launch descriptors, clipboard ownership, ordering, remote PTYs, and bounded update delivery.
kind: agent_context
source_format: agent_context
source_ref: src/workspace.rs
labels: [linux, gtk, workspace, clipboard, lifecycle]
content:
  purpose: Preserve launch context and identity across terminal creation, workspace organization, and session restore.
  workflows:
    - name: Local or script workspace
      steps:
        - Create Workspace accepts an existing local folder and an optional readable POSIX shell script.
        - Pass the canonical folder through Ghostty working_directory. Source the script through config.command before exec of the login shell.
        - Inherit the launch command for splits and terminal tabs. Replay on session restore.
    - name: SSH launch ownership
      steps:
        - AppState.start_ssh owns bridge storage and task scheduling for RPC creation, the SSH dialog and restored workspaces. Replacing a handle aborts its previous task.
        - workspace.ssh.launch records workspace identity, fixed origin and scheduled or unavailable outcome. RPC launches inherit the request trace; dialog and restore generate a new launch UUID. Every retry records this parent_trace_id, linking deployment, hello and PTY setup to the original launch without storing target or command text.
    - name: SSH workspace
      steps:
        - Use an SSH config alias or user@host and an optional absolute remote folder. Authentication uses SSH keys/agent with BatchMode enabled.
        - Install the local daemon with scripts/install-cmuxd-remote.sh before first remote launch. Deploy to remote .local/bin/cmuxd-remote.
        - Deployment control commands use 15-second execution budgets, uploads 60 seconds, and staging cleanup 10 seconds; each expiration allows at most five seconds for direct-child reaping. stdin is null and cancellation uses kill-on-drop. Remote OS effects are not rolled back on uncertain completion.
        - Upload to a unique staging filename, set permissions, and atomically rename it into place so running helpers are not overwritten during reconnect.
        - Each terminal surface owns its own remote context and stream identity. Start stream only after surface initialization; route output by that identity.
        - Persist host, remote folder and layout. Reconnect creates fresh remote shell sessions rather than recovering previous processes.
    - name: Remote setup correlation
      steps:
        - session.spawn and proxy.stream.subscribe carry a generated trace_id. Local ssh.rpc.begin and ssh.rpc.complete records include workspace, request ID, fixed method, elapsed time and success/error/timeout/cancelled categories without request parameters.
        - The owned daemon echoes valid UUID-shaped trace_id values and handler_duration_us in stdio responses; handler time excludes framing, JSON decode, response serialization, output delivery and transport. Invalid string labels are omitted.
        - Missing trace metadata from older daemons remains compatible and remote duration is unknown. Present mismatched trace IDs or invalid durations retire the uncertain setup connection. No remote cancellation or side-effect rollback is implied.
        - Each connection attempt owns ssh.connection.begin/stage/complete records through deployment, handshake, routing, GTK admission and backoff; aborted attempts report cancelled with their current phase. Setup RPC parent_trace_id links to this identity. Hello carries it to the daemon and shares response metadata validation with setup requests. Input/output operation correlation and external browser propagation remain unfinished.
    - name: Session persistence diagnostics
      steps:
        - session.snapshot records GTK construction_us, total duration_us, workspace count and published or worker_closed outcome without user content. Publication cost includes replaced-snapshot destruction and excludes diagnostic recording.
        - session.save records worker serialization and atomic-write timing. Latest-value coalescing prevents one-to-one snapshot/save mapping; publication does not guarantee durability. Normal GTK quit freezes a final live snapshot before teardown and joins the same serialized writer; the final replacement syncs the file and parent directory. session.shutdown records completion duration and success/error, and failures are also reported on stderr. Forced process termination remains outside this guarantee.
    - name: Desktop attention delivery
      steps:
        - Pane bells update GTK attention before optional desktop delivery. Preserve the per-workspace five-second rate limit and unfocused-window policy.
        - The platform builds notify-send commands; src/notification.rs admits at most four async commands with no queue. Capacity rejection does not clear attention.
        - Commands use five-second execution and up to five-second kill/reap cleanup through shared task helpers. Runtime shutdown cancels tasks with direct-child kill-on-drop. Success is helper exit, not desktop presentation.
        - notification.delivery.begin/complete records workspace UUID, generated trace ID, elapsed time and fixed outcome plus optional OS error; rejected records report capacity. Never log workspace names, command arguments or notification content.
    - name: Workspace organization
      steps:
        - GTK drag/drop and Move Up/Down use AppState.reorder_workspace. Move the workspace and corresponding split engine together; preserve active identity and focus.
        - workspace.reorder RPC uses the same operation and snapshots the new ordering.
        - Background colors are validated RGB hex values. Default removes the override. Serialize color with the workspace.
  endpoints:
    - method: session.spawn
      transport: SSH stdio daemon RPC
      description: Starts a remote shell PTY. Optional cwd is passed as the process directory; invalid folders produce spawn_failed. cols and rows set the initial terminal grid.
    - method: stream.resize
      transport: SSH stdio daemon RPC
      description: Resize the PTY belonging to stream_id using cols and rows.
    - method: proxy.close
      transport: SSH stdio daemon RPC
      description: Close and reap the PTY or proxy connection belonging to stream_id.
  schemas:
    workspace_session:
      fields: [uuid, name, working_directory, startup_script, remote_target, remote_directory, color, active_pane_uuid, layout]
      compatibility: New optional fields default to null when reading older session files. Session ordering is array ordering.
  safety:
    - Unsettled remote setup requests retire the connection on timeout, cancellation, dropped replies or malformed identity/status, preventing continued use with unknown remote side effects. Missing usable spawn stream IDs also retire it. Correlated ok=false replies remain ordinary failures; cleanup is initiated rather than a guarantee of remote rollback.
    - GTK-to-SSH admission uses 64 slots of at most 16 KiB raw input each, reserving all callback chunks before encoding. Stream IDs are capped at 256 bytes. Queue overflow, oversize or closure retires that connection and reports possible unsent input; no input is replayed after reconnect. Close/resize commands share the FIFO. Clear old stream targets before publishing the replacement sender.
    - Remote session creation and stream subscription require correlated ok=true replies before readiness; session.spawn must return a nonempty stream_id. Share pending-response registration and cancellation cleanup. A failed subscription requests best-effort closure of the known remote stream and follows local launch-failure cleanup; closure is not acknowledged by this path.
    - Validate SSH hello before spawning terminal sessions or announcing reconnect. A fifteen-second total exchange budget includes silent response waits; require id=1, ok=true, daemon name cmuxd-remote and session.spawn/proxy.stream/proxy.stream.push capabilities. Preserve buffered trailing bytes for routing. Failures enter bounded cleanup/retry and emit ssh.handshake.complete without target or response contents.
    - All SSH RPC writes share a serialized writer with a four-MiB encoded-line cap and ten-second lock/write/flush deadline. Admitted I/O failure, timeout or cancellation retires the connection, signals routing teardown and records ssh.write.retired with workspace ID and fixed reason; oversized encoding fails before transport admission. Routing exits on companion completion as well as read EOF. Separate spawn/subscription reply deadlines remain fifteen seconds.
    - SSH stdout uses shared bounded UTF-8 line framing, capped at four MiB including newline and ten seconds after initial bytes; idle pipes stay open. Rejected frames end the reader and record ssh.framing.rejected with workspace ID and error category.
    - SSH stderr has a connection-owned cancellation guard and fixed four-KiB read buffer. Forward only the first 64 KiB of input to unstructured diagnostics, then drain/discard excess with one ssh.stderr.limited record; structured events omit contents. This bounds buffering, not all SSH allocations. After routing ends, child cleanup allows two seconds normal exit then requests termination with a five-second reap budget; ssh.process.exit records duration/status/forced evidence or error. Kernel-stuck processes and remote descendants can outlive this userspace wait.
    - InheritedConfig owns the sentinel-terminated working_directory allocated by Ghostty newSurfaceOptions. Split/tab creation transfers the non-copying owner into deferred SurfaceInit; Drop calls ghostty_string_free with sentinel true, even when a workspace directory overrides the inherited value or the terminal never realizes. Other native configuration fields retain their existing borrowed/scalar contracts.
    - Validate workspace paths before creating surfaces. Quote shell paths as one POSIX argument.
    - Never route asynchronous clipboard or remote output using the last focused or initialized surface pointer.
    - Resolve untargeted terminal input through the split engine active pane ID, not CSS classes. Restore initializes both model and visual active state.
    - Keep the C launch-command allocation alive with its terminal widget until Ghostty has freed the surface; the embedded shell argv borrows it.
    - PRIMARY selection and the standard clipboard are separate. Ctrl+Shift+C/V applies to terminal widgets; selection and middle-click use Ghostty selection semantics.
    - Replaceable browser frames and session snapshots use latest-value channels. SSH output uses bounded backpressure and must not drop terminal bytes.
    - Closing a terminal clears GTK callback handles before freeing Ghostty and unregisters its remote context. Closing a workspace cancels its SSH process and routing tasks.
    - Configure GDK before GTK initialization. Match Ghostty desktop OpenGL requirements and disable dmabuf on audited GTK 4.16 through 4.22.4 versions affected by the upstream GtkGLArea ownership leak. Dispatch render actions to their target surface.
    - Run executable behavior tests in GitHub Actions, not locally.

  restored_directories: Plain local terminal restore prefers its saved native-reported CWD over the original workspace launch directory. Explicit startup-command and remote restoration keep workspace launch precedence. Deferred GLArea ownership retains the launch directory so snapshots before native initialization preserve it. tests/test_linux_scrollback_restore.py verifies actual restored shell CWD after two normal quits with an unopened background terminal; runtime pending.
