app: cmux-gtk
title: Terminal and pane command ownership
space: cmux-gtk
slug: terminal-commands
summary: Current Rust socket contracts for pane identity, terminal input and bounded viewport reads.
kind: agent_context
source_format: agent_context
source_ref: src/socket/handlers.rs
labels: [linux, gtk, terminal, socket, lifecycle]
content:
  marker_ownership: Socket startup and CLI discovery share paths.socket_marker_path in cmux-platform. Startup replaces the marker through the existing private atomic-write helper, so readers see an entire old or new value and a failed replacement preserves the previous marker. The marker is mode 0600; atomic visibility does not imply fsync durability. Marker-write failure is reported without stopping the already-bound listener.
  output: Normal CLI RPC results are written and flushed explicitly. A closed downstream pipe is successful completion; other stdout failures return the distinct Output error category and exit status 1 without panicking. This does not cancel or undo the already-completed remote command. Help/version output is handled by clap; updater output is a separate path.
  discovery: Linux control-socket discovery lives in crates/cmux-platform/src/discovery.rs. The CLI explicit --socket flag wins; otherwise nonempty CMUX_SOCKET then CMUX_SOCKET_PATH overrides win even for nonexistent paths. Filesystem discovery checks the XDG socket, a UTF-8 last-socket-path marker limited to 4096 bytes, the fixed debug socket and the newest tagged debug path. Marker whitespace is trimmed; invalid, oversized or missing targets are skipped. Debug scanning retains one candidate and preserves first-enumerated ties. Discovery checks path existence, while connection validates socket behavior. CMUX_TAG does not select a socket in this Rust CLI.
  purpose: Worker validation and typed command construction live in src/socket/dispatch.rs; GTK target resolution and mutations live in src/socket/handlers.rs. Resolve targets through the workspace pane tree and preserve focus for observational commands.
  endpoints:
    - method: workspace.list
      transport: Unix JSON socket
      description: Workspace records share identity and naming aliases with workspace.current. pane_count counts split panes; surface_count counts all sibling tabs. A missing layout engine yields null counts rather than fabricated zeroes.
    - method: workspace.current
      transport: Unix JSON socket
      description: Return the active workspace using the same record builder as workspace.list, including id/uuid, title/name, working_directory, selected and layout counts. No focus mutation; absent active workspace returns no_workspace.
    - method: workspace.reorder
      transport: Unix JSON socket
      description: Require a workspace UUID and a nonnegative integer position fitting the native index range. Invalid positions return invalid_params before GTK admission; unknown UUIDs return not_found. Valid positions beyond the final row clamp to the end. Reordering preserves selected workspace identity; the same position is a successful no-op.
    - method: pane.list
      transport: Unix JSON socket
      description: One record per split pane across workspaces. id is a session-local pane:N reference. surface_ids preserves sibling order; active_surface_uuid is the selected tab. uuid remains the selected surface UUID for legacy clients. active and focused mark the focused pane of the active workspace.
    - method: pane.focus
      transport: Unix JSON socket
      description: Accept id as pane:N or a legacy surface UUID in the active workspace. Focus the containing pane without changing its selected tab. Missing targets return not_found.
    - method: surface.focus
      transport: Unix JSON socket
      description: Select the requested surface tab and its containing pane in the active workspace.
    - method: surface.split
      transport: Unix JSON socket
      description: Optional id selects the surface to split in the active workspace; absent id uses the active pane. Unknown id returns not_found without mutation. A successful split focuses the new terminal. Omitted direction defaults to horizontal; explicit direction must be horizontal or vertical, otherwise invalid_params is returned before GTK admission.
    - method: surface.close
      transport: Unix JSON socket
      description: Close a UUID in the active workspace. Sibling removal preserves the selected surviving tab or chooses the same slot with end fallback. Empty-pane removal preserves a surviving active pane; closing the active pane selects a surviving sibling. Unknown UUIDs return not_found. The final workspace surface is retained and reports close_failed. This command does not implement cross-workspace targeting.
    - method: surface.send_text
      transport: Unix JSON socket
      description: Require a string text field; missing or non-string input returns invalid_params before GTK admission. Explicit empty text remains valid. Paste to optional id or the selected terminal without changing focus. Bracketed paste can keep newlines from submitting shell commands; send a literal carriage return through surface.send_key to submit separately. Missing native terminals return not_found; NUL bytes return invalid_params.
    - method: surface.send_key
      transport: Unix JSON socket
      description: Require a string key field; missing or non-string input returns invalid_params before GTK admission. Type one literal Unicode character without bracketed paste and without changing focus. Newline becomes carriage return; NUL returns invalid_params. Empty strings and named key descriptors return not_supported; full key translation remains unfinished.
    - method: debug.type
      transport: Unix JSON socket
      description: Require a string text field using the same input validation as surface.send_text. Paste into the selected terminal; explicit empty text remains valid. This endpoint does not synthesize physical GTK keyboard events.
    - method: surface.read_text
      transport: Unix JSON socket
      description: Return plain clipboard-formatted current viewport text from optional id without changing focus or selection. Native output is bounded to 256 KiB and 65536 cells. Missing terminals return not_found; failed or oversized captures return read_failed. This is a best-effort snapshot during concurrent output.
    - method: surface.health
      transport: Unix JSON socket
      description: alive means a registered native terminal exists; it does not prove the shell process is alive. has_attention is the owning pane's attention state. Browser health is not implemented by this endpoint.
    - method: surface.refresh
      transport: Unix JSON socket
      description: Schedule a redraw of the exact terminal UUID, or selected terminal when id is omitted. Do not focus or select. Missing terminal widgets return not_found.
  safety:
    - Linux authenticates control-socket peers using SO_PEERCRED and the application real UID, in addition to private runtime directory and socket permissions. Same-user external processes are allowed; this port does not implement upstream cmuxOnly ancestry or password modes. A foreign UID is rejected before protocol dispatch even if filesystem access is broadened.
    - Request envelopes must be objects with a string method. Omitted or null params normalize to an empty object; other non-object params return invalid_params before dispatch, including background diagnostics.
    - Optional target IDs for split, terminal input/read/health/refresh and pane focus accept only strings or null; omitted/null retain the documented default behavior. Other types return invalid_params before GTK admission and never fall back to the active terminal.
    - GTK command dispatch has a fixed 64-command waiting queue. Full queues reject before mutation with overloaded; a closed handler reports internal_error. Rejections carry the request trace identity in rpc.queue.rejected diagnostics.
    - Pane references are valid only in the current application lifetime, not persisted identities.
    - Release model and registry locks before GTK callbacks or native input and render calls.
    - Read buffers are freed through RAII and worst-case JSON escaping fits the four-MiB response limit.
    - Validate runtime behavior in GitHub Actions; do not run tests locally.
