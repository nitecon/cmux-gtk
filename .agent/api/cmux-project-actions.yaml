app: cmux-gtk
title: Project action configuration resolution
space: cmux-gtk
slug: project-actions
summary: Bounded cmux.json discovery and explicit fingerprint-checked local command execution.
kind: agent_context
source_format: agent_context
source_ref: src/project_config.rs
labels: [configuration, actions, cli]
content:
  purpose: Resolve project action definitions with source provenance without executing or trusting files.
  resolution:
    - Global XDG config followed by nearest canonical-directory ancestor config. Prefer .cmux/cmux.json over cmux.json at each level. Whole local action entries replace matching global IDs.
    - Regular files only, symlinks followed, nonblocking platform open rejects FIFO/device paths. Files bounded to256KiB, ancestors64, final actions256 and ID bytes128.
    - cmux project-actions --directory PATH returns JSON before socket discovery. Other configuration sections and type-specific action validation are not applied yet.
  verification:
    - Directory fixture covers preferred file, nearest ancestor, global fallback and provenance. Runtime belongs to Actions; strict Clippy passes locally.
  outstanding:
    - Typed schema, GTK/RPC discovery, execution trust, palette, target semantics, workspace layouts and remote configuration reads.

  action_intent:
    - Raw definitions also produce typed command, agent, builtin, workspaceCommand, workspace or metadata intent using upstream explicit-type/inference precedence.
    - Terminal targets are currentTerminal or newTabInCurrentPane, defaulting to new sibling tab. Required executable strings reject blank, NUL and oversized content; literal shell text is preserved. Presentation booleans/strings/keywords are bounded and type-checked.
    - Workspace payloads remain raw objects and builtin names await capability resolution. This is not a validated execution plan. Runtime tests for inference, target and malformed fields await Actions.

  builtin_identity:
    - Builtin names resolve through a closed enum retaining all inspected upstream canonical IDs and aliases; unknown names fail validation.
    - Canonical identity is distinct from execution availability. Agent-chat/cloud/mobile/simulator adaptation and project action dispatch remain outstanding; aliases are covered by Actions tests.

  workspace_layout:
    - Workspace intents contain typed launch strings/environment and recursive pane or split layouts. Panes require surfaces, splits require horizontal/vertical and exactly two children; mixed node types fail.
    - Linux depth16 and surfaces128 bounds apply per workspace. Ratios default0.5 and clamp0.1to0.9. Environment entries64, identifier keys128bytes and aggregate64KiB are checked; strings are bounded and NUL-free.
    - Terminal/browser/project surface kinds and focus booleans are typed. Terminal and browser layouts execute; project rendering, named color resolution and restart semantics remain outstanding. Tests run in Actions only.

  workspace_discovery:
    - project.actions.list accepts optional workspace_id UUID, default current. CLI project-actions --workspace uses this RPC; --directory remains offline and mutually exclusive.
    - GTK captures workspace identity and selected terminal CWD via AppState.local_workspace_directory, shared with Git metadata. Workers have two permits and five-second response deadlines; started filesystem reads retain permits after cancellation/timeouts.
    - Returns workspace_id and config with captured directory and provenance. No focus or execution side effects; remote config is explicitly unsupported pending transport implementation. Trace event project.actions.resolve contains workspace/duration/outcome.
    - Actions Git fixture tests background config lookup and switch after terminal cd without running commands or moving focus. Runtime pending.

  review_identity:
    - Each resolved action carries fingerprint SHA256 over a versioned tuple of captured directory, source path, action ID and full definition.
    - This detects changes between inspection and execution but is not authorization or persistent trust. Execution remains outstanding; tests cover command/target/source/ID/directory invalidation.

  command_execution:
    - project.actions.run requires action_id and fingerprint, optional workspace_id defaults current. CLI project-run ACTION --workspace UUID --fingerprint HASH uses a seven-second client deadline.
    - Re-read under shared two-reader admission and five-second deadline, then reject changed fingerprint, directory or selected terminal before mutation. Explicit request authorizes this execution; fingerprint is not persistent trust.
    - Local command intents support newTabInCurrentPane (default, captured canonical directory, isolated POSIX command then shell) and currentTerminal (literal input then carriage return). Success selects workspace and surface; listing and rejection preserve focus.
    - Response workspace_id, surface_id, status=submitted acknowledges submission, not process completion. project.actions.run logs trace/workspace/surface/duration without command text. Other action families, palette confirmation, persistent trust and remote execution remain outstanding.
    - Actions fixture covers stale rejection and execution directory; runtime pending.

  terminal_builtins:
    - Local project.actions.run also executes canonical cmux.newTerminal, cmux.splitRight and cmux.splitDown through existing SplitEngine operations. Named operation determines layout; command target does not override builtin behavior.
    - Shared fingerprint/context checks precede mutation, success selects and returns new surface, triggers session save and records submission trace. Other builtin integrations remain outstanding.
    - Actions fixture verifies each builtin adds exactly one selected surface and supports normal close/focus cleanup. Strict Clippy and Python AST pass; runtime pending.

  workspace_builtin:
    - cmux.newWorkspace creates and selects a local workspace bound to the reviewed canonical directory, using existing workspace construction/sidebar wiring/session persistence.
    - All run responses and submission traces include source_workspace_id and destination workspace_id plus surface_id. For commands and terminal builtins both workspace IDs are equal.
    - Actions coverage checks distinct workspace identity, captured directory, selected surface and normal close. Strict Clippy and syntax pass; runtime pending. Workspace layout intents remain outstanding.

  browser_builtin:
    - cmux.newBrowser opens about:blank through shared browser startup and cancellation ownership. Captured selected surface must survive unchanged until installation; successful project action selects the browser, ordinary browser.open remains no-focus.
    - project-run client timeout is now thirty seconds for resolution plus browser startup. Submission trace identifies workspace/surface. Mock-browser Actions coverage checks selection and independent daemon cleanup; runtime pending.

  browser_rejection_verification:
    - Delayed project browser fixture changes selected target pane and switches to observer before completion. Requires changed error, unchanged surface/focus snapshot and exact prior daemon set after cleanup.
    - Shared startup owner handles rejected result retirement. Python AST passes; runtime remains in Actions.

  agent_execution:
    - Agent intents execute via existing reviewed command targets. Trimmed claudeCode/claude-code map to claude, openCode/open-code to opencode; args remain trimmed shell text with quoting/expansion.
    - CLI-name validation remains ASCII alphanumeric/dot/underscore/hyphen; arbitrary paths/Unicode names unsupported. Shell resolves installed executables; cmux does not install providers.
    - Matches inspected upstream CmuxConfigAction.terminalCommand. Alias tests and custom printf agent GTK fixture cover exact quoted output; runtime pending Actions. Provider hooks/resume remain separate work.

  named_commands:
    - Resolved commands map retains source/raw definition/typed intent/fingerprint. Local whole-entry precedence and first duplicate name within each file match upstream loadAll; names128bytes, input/merged registries256.
    - workspaceCommand action fingerprints include referenced command source and full definition or absence, rejecting indirect edits on later execution.
    - Discovery does not execute named definitions. Layout launch, restart semantics and complete command-specific validation remain outstanding. Precedence/duplicate/reference-invalidation tests await Actions.

  named_command_schema:
    - Dedicated adapter requires exactly one non-null workspace or command and rejects blank commands. Restart accepts new/recreate/ignore/confirm; metadata validation is bounded.
    - Action-only fields cannot override named intent. All duplicates validate before first-name precedence. Tests cover ambiguity, malformed restart/confirm and inference isolation. Restart launch semantics remain outstanding.

  native_launch_environment:
    - Configured local SurfaceIoMode owns optional command and validated environment. SplitEngine retains overrides for new tabs/splits; native strings survive ghostty_surface_new.
    - Merge inherited values then explicit overrides then fresh routing identity. Filter CMUX_ overrides case-insensitively; no process-global mutation.
    - Native Actions fixture checks literal values and forged surface-ID rejection. Workspace action application and environment persistence remain outstanding.

  launch_environment_persistence:
    - WorkspaceSession launch_environment defaults empty and captures explicit SplitEngine overrides only. Restored local surfaces and later tabs retain overrides; native managed identity still wins.
    - Deserialization shares project environment entry/key/value/aggregate bounds. Round-trip, legacy omission and malformed-map tests await Actions. Project layout application remains outstanding.

  launch_environment_runtime_coverage:
    - Multi-restart fixture seeds explicit overrides, leaves workspace unopened across another quit, verifies saved retention and actual child values in restored and later split terminals.
    - Literal dollar-sign/space values must survive and each child must receive its real surface ID despite a forged CMUX_SURFACE_ID override. Existing history/CWD checks retained. AST passes; runtime pending Actions.

  layout_restore_depth:
    - Project parser and GTK session builder share MAX_LAYOUT_DEPTH16. Inspected upstream has no explicit source-level bound; Linux limits depth for GTK responsiveness.
    - Actions runs34062084578 and34063064981 showed non-shrinking GtkPaned descendants listening on the socket but failing readiness for ten seconds at17 and16 nested splits. Live/restored dividers now permit constrained descendants below natural size to bound GTK negotiation.
    - The boundary fixture restores16 nested splits and asserts17 panes/surfaces plus workspace name.

  default_workspace_execution:
    - Inline workspace and named workspaceCommand actions create default-layout workspaces with name/cwd/RGB color/env. Relative cwd resolves from reviewed canonical directory; preparation runs under existing reader worker/deadline before GTK mutation.
    - Configured creation applies env to first surface before realization and retains overrides for new tabs and session snapshots. Result carries source/destination workspace and selected surface IDs.
    - Layout/setup and explicit named restart policies other than new are rejected. Omitted restart currently creates new; complete restart semantics remain outstanding. Actions tests cover inline/named actual child values; runtime pending.

  workspace_setup:
    - Default-layout setup is one-shot literal input plus carriage return after first native terminal initialization. Pending text is consumed/released and not saved or inherited by future tabs.
    - workspace.setup.submit records pane/outcome without script. Submission is not exit status. Inline/named fixtures check actual configured-environment output; runtime pending.

  custom_workspace_layout_execution:
    - Worker preparation canonicalizes every terminal cwd, assigns stable UUIDs and selects the last focus=true surface before GTK allocation. Unsupported project surfaces fail explicitly.
    - GTK installs the complete split tree without a placeholder terminal. Setup is consumed by the first terminal and combined with its command; later terminal commands remain independent. Surface environment wins over workspace values and persisted maps reuse bounded validation.
    - Browser surfaces use shared lazy restored-tab startup and cancellation ownership. Actions fixtures cover terminal topology/focus/setup/command/environment and browser navigation/daemon cleanup; runtime pending.

  workspace_restart_policies:
    - Named definitions retain new/recreate/ignore/confirm. Existing workspaces match by exact display name, following the inspected upstream executor.
    - New always launches; ignore selects an existing match without side effects; recreate creates the replacement before closing the match so construction failure preserves the old workspace.
    - Confirm returns confirmation_required on collision until an interactive or explicit CLI caller submits a choice. Actions checks ignore/recreate/confirm workspace identity and counts; runtime pending.

  command_palette:
    - Header, hamburger menu and Ctrl+Shift+P open a searchable palette resolved for the captured active local workspace. Metadata-only and palette=false actions are excluded; configuration text is rendered without markup; Enter executes the first visible result.
    - Palette resolution/execution reuse the bounded worker and fingerprint-checked project runner. Pending tasks and row callbacks retain only weak GTK/model references; open/resolve/run share a fresh trace identity without definition contents.
    - confirm=true and restart=confirm fail closed with confirmation_required. The GTK palette presents Run/Cancel plus the complete bounded reviewed definition and referenced named command/source, then retries only after acceptance; project-run --confirm carries the same explicit decision for CLI automation.
