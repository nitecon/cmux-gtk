app: cmux-gtk
title: Project action configuration resolution
space: cmux-gtk
slug: project-actions
summary: Bounded read-only cmux.json action resolution and outstanding execution/palette integration.
kind: agent_context
source_format: agent_context
source_ref: src/project_config.rs
labels: [configuration, actions, cli]
content:
  purpose: Resolve project action definitions with source provenance without executing or trusting files.
  resolution:
    - Global XDG config followed by nearest canonical-directory ancestor config. Prefer .cmux/cmux.json over cmux.json at each level. Whole local action entries replace matching global IDs.
    - Regular files only, symlinks followed, nonblocking platform open rejects FIFO/device paths. Files bounded to256KiB, ancestors64, final actions256 and ID bytes128.
    - cmux project-actions --directory PATH returns JSON before socket discovery. Other configuration sections and type-specific action validation are not applied yet.
  verification:
    - Directory fixture covers preferred file, nearest ancestor, global fallback and provenance. Runtime belongs to Actions; strict Clippy passes locally.
  outstanding:
    - Typed schema, GTK/RPC discovery, execution trust, palette, target semantics, workspace layouts and remote configuration reads.

  action_intent:
    - Raw definitions also produce typed command, agent, builtin, workspaceCommand, workspace or metadata intent using upstream explicit-type/inference precedence.
    - Terminal targets are currentTerminal or newTabInCurrentPane, defaulting to new sibling tab. Required executable strings reject blank, NUL and oversized content; literal shell text is preserved. Presentation booleans/strings/keywords are bounded and type-checked.
    - Workspace payloads remain raw objects and builtin names await capability resolution. This is not a validated execution plan. Runtime tests for inference, target and malformed fields await Actions.

  builtin_identity:
    - Builtin names resolve through a closed enum retaining all inspected upstream canonical IDs and aliases; unknown names fail validation.
    - Canonical identity is distinct from execution availability. Agent-chat/cloud/mobile/simulator adaptation and project action dispatch remain outstanding; aliases are covered by Actions tests.

  workspace_layout:
    - Workspace intents contain typed launch strings/environment and recursive pane or split layouts. Panes require surfaces, splits require horizontal/vertical and exactly two children; mixed node types fail.
    - Depth32 and surfaces128 bounds apply per workspace. Ratios default0.5 and clamp0.1to0.9. Environment entries64, identifier keys128bytes and aggregate64KiB are checked; strings are bounded and NUL-free.
    - Terminal/browser/project surface kinds and focus booleans are typed. Project rendering, color resolution, restart semantics, managed environment precedence and actual execution remain outstanding. Tests run in Actions only.
