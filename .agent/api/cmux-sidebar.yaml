app: cmux-gtk
title: Agent workspace status and progress
space: cmux-gtk
slug: workspace-sidebar-metadata
summary: Bounded persistent keyed status and progress updates without focus changes.
kind: agent_context
source_format: agent_context
source_ref: src/workspace_metadata.rs
labels: [sidebar, workspace, cli, session]
content:
  purpose: Agents publish status and determinate progress for a selected workspace independently of terminal focus.
  workflows:
    - name: Update workspace metadata
      steps:
        - cmux set-status KEY VALUE accepts --icon (GTK theme name), --color (#RRGGBB), --priority and --workspace UUID (--tab alias). Higher priorities render first, then lexical key order. Use --format plain or markdown and optional --url (--link alias) for HTTP(S) destinations. GTK renders inline emphasis, strikethrough, code and links using escaped markup; raw HTML is displayed literally, images retain alt text without resource fetches, and block boundaries collapse to spaces. Whole-row URLs take precedence over embedded links; normal GTK label activation opens the destination only on user activation.
        - cmux clear-status KEY removes a key; cmux list-status --json returns workspace_id, statuses, blocks and progress. Commands use CMUX_WORKSPACE_ID when available, otherwise the active workspace. Unknown explicit targets fail.
        - cmux set-progress VALUE --label TEXT clamps finite values to 0..1; cmux clear-progress removes the bar. Both accept --workspace.
    - name: Publish multiline summaries
      steps:
        - cmux report-meta-block KEY MARKDOWN --priority N --workspace UUID upserts a separate block; clear-meta-block KEY removes it and list-meta-blocks --json returns the full metadata snapshot including blocks.
        - Each workspace retains at most eight blocks of 8192 bytes each, with the same 64-byte keys and no NUL. Empty blocks fail. Existing keys may update at capacity; new keys fail without eviction. Data persists through the session writer and is sanitized on load.
        - Blocks render in priority/key order as initially collapsed GTK expanders with an internal 240-pixel maximum-height scroll view. Expansion survives metadata refreshes in the live row. Headings, paragraphs, list markers, code and inline formatting retain multiline structure; images show alt text without downloads. CLI and JSON preserve literal Markdown bytes including newlines, unlike the upstream legacy parser that expands backslash escapes.
  contracts:
    transport: JSON sidebar.metadata, sidebar.set_status, sidebar.clear_status, sidebar.set_progress and sidebar.clear_progress use workspace_id. sidebar.report_meta_block and sidebar.clear_meta_block share that target contract. These are Linux adapters; upstream legacy v1 wire commands are not yet bridged.
    limits: At most 32 keyed status entries per workspace, 64-byte nonempty keys, 1024-byte values, 128-byte icons, 2048-byte HTTP(S) URLs and 512-byte progress labels. NUL and invalid colors are rejected before GTK dispatch. At capacity existing keys may update; new keys fail without eviction. Loaded state is bounded and sanitized.
    ownership: GTK owns state and widgets. Mutation refreshes only the metadata container and uses the existing serialized session writer; reads do not save. Existing common RPC timing covers operations without logging status content.
    outstanding: Panel provenance, SF Symbols translation, automatic Git/PR/port updates and project/diff views remain separate parity gaps. Unsupported formats and panel fields fail explicitly.
  operations:
    verification: Strict workspace clippy passed locally. Actions tests/test_linux_sidebar_metadata.py exercises the real CLI, inactive workspace targeting, capacity and invalid input, persistence and progress clearing. Rust tests cover nested emphasis, code/HTML escaping, unsupported URL schemes and outer-link precedence. The native fixture also retains Markdown and URL fields. The native fixture also covers block upsert, capacity, oversize and empty rejection, persistence and removal; Rust coverage checks multiline structure and loaded bounds. Runtime verification is pending; GTK presentation and external browser activation have no screenshot/click assertion yet.
