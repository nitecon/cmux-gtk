app: cmux-gtk
title: Notification inbox and exact target routing
space: cmux-gtk
slug: notification-inbox
summary: Bounded persistent inbox, exact target routing, native OSC messages and actionable Linux desktop delivery; full provider and protocol parity remains in progress.
kind: agent_context
source_format: agent_context
source_ref: src/inbox.rs
labels: [notification, inbox, cli, session, observability]
content:
  purpose: Deliver agent messages without stealing focus and retain enough bounded history to navigate back to their exact terminals.
  workflows:
    - name: Deliver and inspect
      steps:
        - cmux notify accepts --title, --subtitle, --body, --workspace and --surface. Without explicit selectors, the CLI uses create_for_caller with ambient CMUX_SURFACE_ID/CMUX_WORKSPACE_ID and native standard-descriptor TTY evidence. Explicit CLI selectors use direct notification.create targeting.
        - notification.create accepts workspace_id and surface_id; create_for_surface requires surface_id; create_for_target requires both. Explicit stale, malformed and conflicting targets fail without fallback or focus changes.
        - Titles allow 512 bytes, subtitles 1024 and bodies 8192; all reject NUL. Focused current-terminal delivery creates an already-read record. Other delivery creates unread history, pane rings and sidebar dots.
        - notification.list returns notifications with id, workspace_id, surface_id, title, subtitle, body, created_at and is_read. Legacy workspace BEL attention rows are now under workspace_attention. CLI notifications list and list-notifications use this result.
    - name: Mutate history without focus
      steps:
        - notification.mark_read selects exactly one of id, workspace_id (optionally surface_id), or all=true. tab_id aliases workspace_id. It retains records and marks only matching unread records read.
        - notification.dismiss selects id or all_read=true and removes those records. notification.clear removes all history or an explicit workspace/surface scope. Its legacy id field aliases workspace_id. caller=true uses preferred selectors and live local TTY attribution; caller and explicit scope selectors cannot be combined.
        - CLI notifications mark-read, dismiss and clear expose these operations. Legacy clear-notification takes a workspace UUID. No history mutation selects another workspace or terminal.
    - name: Navigate and restore
      steps:
        - notification.open requires a notification id, validates the original target, selects that exact workspace and sibling terminal tab, then marks the message read. Closed targets return not_found rather than redirecting.
        - notification.jump_to_unread opens the newest unread record; an empty unread history returns opened=false. CLI notifications open and jump-to-unread map directly.
        - Session snapshots retain at most 256 messages and 1 MiB of accounted content/identity data. Read records are evicted first, then the oldest unread record. Startup validates retained field lengths and reconciles pane/sidebar indicators.
        - Creation diagnostics include message/target IDs, focused state and evicted count without message content. Common RPC tracing covers validation, queueing, execution and response.
  operations:
    verification: Actions runs tests/test_linux_notifications.py with real GTK terminals, plus retained-bound/selector unit cases. Runtime evidence is pending for the initial implementation.
    outstanding: Advanced OSC99 query/replacement/activation reports, other provider hook delivery, nested/remote caller resolution remain part of the active parity goal.

    panel: View > Notifications or Ctrl+Shift+I opens one nonmodal live panel. Ctrl+Shift+U jumps to unread. A watch signal coalesces mutations; the GTK listener and action handlers hold weak references and closing aborts the listener. Rows render plain text, open exact targets or dismiss messages; bulk controls mark read or clear. Native CI checks live unread-title updates and navigation.

    native_output: The initial native PTY tee installs a surface-owned bounded OSC parser before IO startup; manual remote output uses the same callback. OSC9 and OSC777 notifications plus OSC99 title/body/i/d/e chunk fields enter the bounded native event queue with exact sibling UUIDs. Native desktop callbacks are acknowledged to avoid duplicates. Maximum frame 16384 bytes, eight incomplete messages per terminal, 60-second idle expiry and existing notification field caps. Context is freed after native IO joins.
    parser_metrics: diagnostics.notification_parser exposes output_bytes, parse_ns, accepted, queue_rejected and oversize_frames. No raw output or message content is logged.

    claude_hooks: cmux hooks setup claude installs Stop and Notification handlers alongside native session lifecycle handlers. Stop sends last_assistant_message; Notification sends title/message/notification_type to the originating CMUX_SURFACE_ID. Long text is visibly truncated at UTF-8 boundaries. Neither event clears resume metadata or moves focus.

    desktop: Background inbox creation invokes notify-send with escaped plain body/subtitle and an explicit default action. Four active helpers share BEL admission without queueing; message execution is capped at 15 seconds, stdout 256 bytes and stderr 4096 bytes. Successful default action queues the stable notification UUID for GTK routing; stale targets do not redirect. Failure/overload retains inbox attention. Diagnostics include notification identity without content. Actions tests/test_linux_desktop_notifications.py uses a controlled helper and real GTK to verify payload and click routing; external daemon presentation is not covered.

    caller: notification.create_for_caller accepts preferred_workspace_id, preferred_surface_id, preferred_workspace_is_explicit, caller_tty and prefer_tty. Stable surfaces outrank TTY evidence; an explicit workspace is a hard scope, while ambient workspace hints permit rehomed surfaces. Unique live local Ghostty TTYs resolve without saved or remote PTY guesses. Failed claims return not_found. A known workspace without terminal evidence and selector-free callers create workspace-only records with surface_id null. Open preserves that workspace's selected terminal; surface clear does not remove workspace-only messages. CLI notify without explicit selectors uses ambient caller evidence; notifications clear --caller shares it. No shell-reported nested TTY fallback yet. Actions tests/test_linux_notification_caller.py verifies real native attribution and persisted nullable identity.
