app: cmux-gtk
title: Attributed listener discovery
space: cmux-gtk
slug: workspace-listeners
summary: Linux process-qualified TCP listener collection and remaining workspace/remote integration.
kind: agent_context
source_format: agent_context
source_ref: crates/cmux-platform/src/listeners.rs
labels: [ports, workspace, remote, observability]
content:
  purpose: Attribute development listeners to terminal-owned processes rather than machine-wide port numbers.
  workflows:
    - name: Platform collector
      steps:
        - The caller supplies up to 256 PID and Linux start-tick identities. Worker-only scanning reads at most 4096 descriptors per process and two MiB per tcp/tcp6 table.
        - Socket descriptor inodes intersect LISTEN entries in that process network namespace. The application submits all matched processes as one batch. Each namespace table is read once per scan, bounded to 16 namespaces and 16384 listeners each; an open namespace handle prevents cached identity reuse while scanning. Identity is rechecked after scanning; exited or reused identities are omitted and other I/O failures propagate.
        - Results contain owning process identity, bind address, TCP port and inode. The separate process_tree helper discovers current descendants from a qualified root across all spawning threads, limited to 256 processes and 1024 threads per process. It checks parent identity around traversal and validates each child parent from the same stat record as its start ticks. Collection does not schedule work or mutate application state.
  verification:
    - A real platform TCP listener test checks attribution, changed-start-tick rejection and disappearance after socket close. Runtime execution is through Actions only.
  outstanding:
    - Extend attribution to detached descendants with durable validated root ownership.
    - Add remote daemon collection and automatic forwarding with browser origin routing.

  application:
    - A window-owned loop visits local workspaces round-robin with one second between scans. GTK copies native terminal UUID and TTY names. One blocking worker matches current application descendants by controlling-terminal device, then collects their owned TCP listeners.
    - Workspace ports are null before observation or on scan failure, and an array after success. Records include surface_uuid, address, port, pid and local provenance. list-workspaces JSON exposes records; a dedicated sidebar label shows up to eight unique ports. Observations are transient and never saved or focused.
    - Results apply only if the workspace and native terminal topology still match. Scans emit workspace.ports.scan duration, outcome and count without paths or addresses. A running blocking filesystem scan cannot be interrupted; no second scan is started while it runs.
    - Actions test_linux_ports.py launches a real listener in a terminal, observes it from another selected workspace, excludes an unrelated listener and verifies disappearance after exit. Runtime evidence pending.

  endpoints:
    - method: ports.list
      description: Read the latest observed workspace listeners without initiating a scan or changing selection. Optional workspace_id and surface_id must be UUIDs. A surface alone resolves its owning workspace; a conflicting pair fails. Omitted scope uses the selected workspace. Response includes workspace_id, optional surface_id and ports, where null indicates unavailable and an empty array means no observed listeners.
  cli:
    - cmux ports accepts --workspace (alias --tab, default CMUX_WORKSPACE_ID), --surface and --json. It uses ports.list and preserves exact target validation.

  remote_daemon:
    - The Linux daemon advertises ports.list with required stream_id. It accepts only a currently registered PTY connection, captures the owned shell PID/start ticks, walks its current descendants and matches listening TCP/IPv6 socket inodes to their file descriptors.
    - Collection limits processes to 256, threads to 1024 per process, descriptors to 4096 per process, TCP tables to two MiB, child lists to 64 KiB and results to 256. Root and per-process identity are rechecked; a stream retired during collection cannot publish a successful result.
    - Remote records contain address, port, pid and remote provenance. Missing, non-PTY, unsupported-platform and failed scans return explicit errors. Remote table batching and automatic forwarding are still outstanding.
    - Go Actions coverage launches a real listener helper from the registered PTY, excludes a listener owned by the test caller and rejects a retired stream. Local Go build passes; runtime verification pending.

  remote_desktop:
    - Each connected SSH routing task polls one current PTY stream every two seconds through the existing bounded correlated request transport. Connection teardown aborts the poller and its pending request.
    - Validated observations require at most 256 rows, nonzero PID/port, remote provenance and a matching response stream_id. The bridge retains only current stream observations and clears them on reconnect or context removal.
    - GTK maps observations through the current remote context pointer and stream identity to the real surface UUID. Disconnected, changed or incompletely observed streams are unavailable; EOF contexts contribute no listeners. The shared sidebar and ports.list API preserve remote provenance without selecting a workspace.
    - The existing real SSH Actions launch fixture starts a remote PTY child listener, observes it while another workspace is selected, and requires removal after the service exits. Runtime evidence pending.

  forwarding:
    - Connection-owned supervisor forwards discovered remote sockets through existing proxy RPCs, with at most sixteen loopback listeners and sixteen clients, sixteen queued 32-KiB chunks per client and thirty-two live/retiring listener tasks.
    - Ports expose forwarded_local_port, null for local or not-yet-forwarded services. Local binds prefer the remote port and fall back to an ephemeral port on conflict. Unknown destinations are never accepted from local clients.
    - Proxy data routing never awaits local writes on the shared SSH reader. Invalid/full queues retire the client route and emit a rejection event. Client cleanup queues remote close through existing control admission; full connection teardown is the cleanup fallback.
    - Runtime verification and full forwarding gates in Docs/RemoteForwarding.md remain pending, including half-close, acknowledged close, reconnect/overload and browser subresource routing.

  proxy_half_close:
    - The daemon advertises proxy.shutdown_write, requiring a registered TCP stream_id. It sends FIN without removing the stream or closing the response reader; missing/non-TCP streams fail explicitly.
    - Forwarded local EOF invokes shutdown_write and continues reading until remote EOF or listener cancellation. The Go real-TCP test and SSH integration fixture verify response-after-request-EOF. Reverse half-close and older-daemon compatibility remain outstanding.

  forwarding_metrics:
    - diagnostics.remote_forwarding exposes active listener/client task gauges, remote-write acknowledged bytes, local-write completed bytes, data/client rejection counters and close requests. Gauges include startup/draining and are balanced on task cancellation.
    - Snapshots use independently sampled atomics and aggregate all connections, while capacity fields describe per-connection limits. Partial failed writes are excluded; requested closes are not acknowledgements. The SSH fixture verifies transfer deltas and client cleanup.

  forwarding_cleanup:
    - Normal completion and subscription failure await idempotent proxy.close with the existing deadline and require closed true. The owner persists during the await; cancelled or failed waits retain the queued-close fallback.
    - confirmed_closes and failed_closes distinguish observed outcomes from close_requests, which also includes fallback attempts. The SSH transfer fixture requires a confirmed close without a failed close.

  proxy_read_eof:
    - proxy.stream.subscribe accepts optional boolean half_close. With true, clean TCP read EOF emits proxy.stream.read_eof and retains the writable registered stream; default subscriptions keep full-retirement behavior. The daemon advertises proxy.stream.half_close.
    - Forwarding opts in, shuts down only the local response direction on read EOF, and waits for both directions. Sixteen data slots plus one reserved terminal-marker slot preserve ordering; error/overload markers abort rather than appearing as clean EOF.
    - Real-TCP Go tests verify late request writes after remote FIN, and Rust route tests verify EOF behind a full data queue. The real SSH fixture also receives response FIN before sending a multi-chunk request and checks exact bytes and acknowledged cleanup; runtime verification is pending.

  negotiation:
    - Each hello retains optional capabilities for that connection generation. ports.list is polled only when advertised; forwarding additionally requires proxy.shutdown_write and proxy.stream.half_close. Terminal-capable older daemons remain usable without publishing unsafe forwarding endpoints.
    - ssh.handshake.complete records ports_supported and forwarding_supported. A missing optional feature remains unavailable until the remote daemon is upgraded and a new connection negotiates it; no feature state is inherited across reconnects.
    - Duplex handshake tests cover full, partial and absent optional capability sets. Runtime execution is through Actions only.

  browser_proxy_transport:
    - Workspace bridge retains a loopback SOCKS listener across SSH reconnects. Lifecycle-owned accept work caps negotiation at sixteen tasks with a five-second deadline and captures current generation admission at accept.
    - Validated no-auth CONNECT requests enter a sixteen-slot channel and share sixteen transfer permits with discovered port clients. Hostname resolution occurs remotely; success follows subscription, and all transfers share half-close and acknowledged cleanup.
    - Browser startup is not wired yet. Protocol tests cover hostname payload preservation and unsupported authentication; runtime and full browser origin verification remain pending Actions.

  browser_proxy_startup:
    - BrowserManager.for_workspace captures a remote bridge for UI, background RPC and suspended page initialization, retaining its bound endpoint through bounded daemon shutdown.
    - Startup waits at most five seconds for current proxy admission inside the fifteen-second transaction, then passes explicit SOCKS proxy and <-loopback> bypass arguments. Missing or unavailable remote transport fails without launching with local defaults.
    - Actual child argument coverage is added; namespace-isolated remote web, WebSocket and reconnect verification remain pending Actions.

  socks_handshake_metrics:
    - diagnostics.remote_forwarding includes active_socks_handshakes, socks_handshake_successes/errors/timeouts and per-workspace capacity16/deadline5000ms. Gauges include rejection reply cleanup; cancellation does not fabricate completed outcomes.
    - ssh.browser_proxy.handshake records workspace_id, outcome and duration_us without destination data. The isolated browser Actions fixture checks sixteen occupied slots, seventeenth rejection, timeout cleanup, CLI responsiveness and navigation recovery; runtime evidence is pending.
