app: cmux-gtk
title: Attributed listener discovery
space: cmux-gtk
slug: workspace-listeners
summary: Linux process-qualified TCP listener collection and remaining workspace/remote integration.
kind: agent_context
source_format: agent_context
source_ref: crates/cmux-platform/src/listeners.rs
labels: [ports, workspace, remote, observability]
content:
  purpose: Attribute development listeners to terminal-owned processes rather than machine-wide port numbers.
  workflows:
    - name: Platform collector
      steps:
        - The caller supplies up to 256 PID and Linux start-tick identities. Worker-only scanning reads at most 4096 descriptors per process and two MiB per tcp/tcp6 table.
        - Socket descriptor inodes intersect LISTEN entries in that process network namespace. The application submits all matched processes as one batch. Each namespace table is read once per scan, bounded to 16 namespaces and 16384 listeners each; an open namespace handle prevents cached identity reuse while scanning. Identity is rechecked after scanning; exited or reused identities are omitted and other I/O failures propagate.
        - Results contain owning process identity, bind address, TCP port and inode. The separate process_tree helper discovers current descendants from a qualified root across all spawning threads, limited to 256 processes and 1024 threads per process. It checks parent identity around traversal and validates each child parent from the same stat record as its start ticks. Collection does not schedule work or mutate application state.
  verification:
    - A real platform TCP listener test checks attribution, changed-start-tick rejection and disappearance after socket close. Runtime execution is through Actions only.
  outstanding:
    - Extend attribution to detached descendants with durable validated root ownership.
    - Add remote daemon collection and automatic forwarding with browser origin routing.

  application:
    - A window-owned loop visits local workspaces round-robin with one second between scans. GTK copies native terminal UUID and TTY names. One blocking worker matches current application descendants by controlling-terminal device, then collects their owned TCP listeners.
    - Workspace ports are null before observation or on scan failure, and an array after success. Records include surface_uuid, address, port, pid and local provenance. list-workspaces JSON exposes records; a dedicated sidebar label shows up to eight unique ports. Observations are transient and never saved or focused.
    - Results apply only if the workspace and native terminal topology still match. Scans emit workspace.ports.scan duration, outcome and count without paths or addresses. A running blocking filesystem scan cannot be interrupted; no second scan is started while it runs.
    - Actions test_linux_ports.py launches a real listener in a terminal, observes it from another selected workspace, excludes an unrelated listener and verifies disappearance after exit. Runtime evidence pending.

  endpoints:
    - method: ports.list
      description: Read the latest observed workspace listeners without initiating a scan or changing selection. Optional workspace_id and surface_id must be UUIDs. A surface alone resolves its owning workspace; a conflicting pair fails. Omitted scope uses the selected workspace. Response includes workspace_id, optional surface_id and ports, where null indicates unavailable and an empty array means no observed listeners.
  cli:
    - cmux ports accepts --workspace (alias --tab, default CMUX_WORKSPACE_ID), --surface and --json. It uses ports.list and preserves exact target validation.
