app: cmux-gtk
title: Bounded terminal scrollback capture
space: cmux-gtk
slug: terminal-scrollback
summary: Bounded native VT history capture, session retention and synchronous replay before child output.
kind: agent_context
source_format: agent_context
source_ref: src/ghostty/text.rs
labels: [terminal, session, scrollback, cli, observability]
content:
  purpose: Capture recent rendered history without changing terminal selection, viewport or active workspace.
  workflows:
    - name: Inspect history
      steps:
        - cmux read-scrollback --id UUID --json calls surface.read_scrollback with id. Omitted id resolves the active terminal; explicit unknown targets fail.
        - The response text is VT output, capped at 256 KiB and 2000 rows. It preserves native rendered SGR cell styles and Unicode, not raw PTY control sequences. The replay filter removes OSC (including theme and hyperlink metadata), DCS and other terminal command channels, retains visible text/whitespace and complete numeric SGR, and includes boundary resets within the byte limit. The native formatter shrinks the history suffix to fit its fixed scratch allocation.
        - Native allocations are released synchronously on GTK. There is no local process launch, viewport mutation or clipboard change. Existing common RPC tracing covers routing and timing without recording text.
  operations:
    verification: Actions tests/test_linux_scrollback.py captures offscreen styled output from an inactive native terminal and checks focus, viewport and byte bounds. Strict workspace clippy and fixture syntax passed locally; runtime verification is pending.
    outstanding: Native runtime verification and wider agent/session parity remain pending. This restores terminal history, not arbitrary running processes.

    session: Session snapshots capture per-terminal styled history with a 256-KiB individual and 16-MiB aggregate cap. Loaded history is normalized before GTK ownership. Uninitialized background surfaces keep widget-owned pending text across further snapshots; successful native initialization consumes that cache after synchronous history application. The new ghostty_surface_new_with_replay ABI preserves options and configured launches, applies normalized output after renderer startup and before IO thread startup, and borrows data only through return. No replay files or stdin injection. Actions tests/test_linux_scrollback_restore.py covers two normal quit/restarts including an unopened background workspace and fresh child output after replay. session.scrollback.replay diagnostics record bytes, elapsed creation/replay time and outcome without content.

    previous_session: Normal startup archives a valid nonempty current snapshot to session.previous.json atomically and syncs file/parent before GTK activation. Autosaves leave it unchanged. After quitting, cmux-app --restore-previous-session loads this backup without overwriting it; missing or invalid backup exits nonzero and preserves session.json. Tests/test_linux_previous_session.py covers real lifecycle restoration and failure preservation in Actions. A durable session.running owner token prevents backup rotation after unclean exits; only successful final save clears the owned marker. In-app multiwindow reopen remains outstanding.

    capture_metrics: diagnostics.session_scrollback exposes cumulative captures, capture_ns, capture_bytes, capture_failures, pending_reuses and budget_skips. Pending text is Arc-shared across loaded state/widgets/snapshots, with unchanged JSON strings and limits. Live history is freshly captured to include non-PTY native mutations. Existing native capture/restart tests verify behavior; metric assertions run in Actions.
