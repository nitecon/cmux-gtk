name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  remote-daemon-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: daemon/remote/go.mod

      - name: Run remote daemon tests
        working-directory: daemon/remote
        run: go test ./...

      - name: Validate remote daemon release assets
        run: ./tests/test_remote_daemon_release_assets.sh

  web-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3 # v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun tsc --noEmit

  linux-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Install Linux dependencies and build Ghostty
        run: ./scripts/setup-linux-dev.sh

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Check workspace
        run: cargo check --workspace --bins

      - name: Clippy correctness and suspicious lints
        run: cargo clippy --workspace --bins -- -D clippy::correctness -D clippy::suspicious

      - name: Build debug binaries
        run: cargo build --workspace --bins

      - name: Install headless UI test dependencies
        run: sudo apt-get install -y xvfb dbus-x11

      - name: Test terminal pane close lifecycle
        run: dbus-run-session -- xvfb-run -a ./tests/test_linux_terminal_pane_close.sh

      - name: Test surface tab close with browser mapping
        run: dbus-run-session -- xvfb-run -a ./tests/test_linux_surface_tab_reentrant_close.sh

      - name: Run unit tests
        run: cargo test --workspace --bins
