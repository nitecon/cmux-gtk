name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  remote-daemon-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: daemon/remote/go.mod

      - name: Run remote daemon tests
        working-directory: daemon/remote
        run: go test ./...

      - name: Test remote daemon stdio resize lifecycle
        run: python3 tests_v2/test_ssh_remote_daemon_resize_stdio.py

      - name: Validate remote daemon release assets
        run: ./tests/test_remote_daemon_release_assets.sh

  linux-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Test package validation helpers
        run: |
          bash tests/test_package_validation.sh
          bash tests/test_release_version.sh
          bash tests/test_release_libraries.sh

      - name: Identify Ghostty build cache
        id: ghostty_revision
        run: echo "revision=$(git rev-parse HEAD:ghostty)" >> "$GITHUB_OUTPUT"

      - name: Restore Ghostty build cache
        id: ghostty_cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .tools
            ghostty/.zig-cache
            ghostty/zig-out
            ~/.cache/zig
          key: ghostty-${{ runner.os }}-${{ runner.arch }}-${{ steps.ghostty_revision.outputs.revision }}-${{ hashFiles('scripts/setup-linux*.sh') }}

      - name: Install Linux dependencies and build Ghostty
        run: ./scripts/setup-linux-dev.sh

      - name: Save Ghostty build cache
        if: steps.ghostty_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .tools
            ghostty/.zig-cache
            ghostty/zig-out
            ~/.cache/zig
          key: ${{ steps.ghostty_cache.outputs.cache-primary-key }}

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Check workspace
        run: cargo check --workspace --bins

      - name: Check platform services without GTK
        run: |
          cargo check -p cmux-platform --no-default-features
          cargo check -p cmux-platform --no-default-features --features async-io

      - name: Clippy correctness and suspicious lints
        run: cargo clippy --workspace --bins -- -D clippy::correctness -D clippy::suspicious

      - name: Build debug binaries
        id: debug_build
        run: cargo build --workspace --bins

      - name: Test version flags without a display or socket
        run: python3 tests/test_cli_version_flag.py

      - name: Test Python tooling and fixture helpers
        run: |
          python3 tests/test_socket_discovery.py
          python3 tests/test_cli_socket_autodiscovery.py
          python3 tests_v2/test_cli_support.py
          python3 tests/test_socket_transport.py
          python3 tests/test_python_client.py
          python3 tests/test_benchmark_report.py
          python3 tests/test_benchmark_comparison.py
          python3 tests/test_diagnostic_collector.py
          python3 tests/test_process_support.py

      - name: Test prompt probe cleanup
        run: python3 tests/test_prompt_probe.py

      - name: Install headless UI test dependencies
        run: sudo apt-get install -y xvfb dbus-x11 openbox xdotool wmctrl x11-utils

      - name: Test terminal pane close lifecycle
        run: dbus-run-session -- xvfb-run -a python3 tests/test_linux_terminal_pane_close.py

      - name: Test CLI closed-pipe and output-error handling
        run: dbus-run-session -- xvfb-run -a python3 tests/test_cli_sigpipe_ignore.py

      - name: Test Linux socket access boundaries
        run: dbus-run-session -- xvfb-run -a python3 tests/test_socket_access.py

      - name: Test unfocused terminal SIGINT delivery
        run: dbus-run-session -- xvfb-run -a python3 tests/test_linux_terminal_sigint.py

      - name: Test surface tab close with browser mapping
        run: dbus-run-session -- xvfb-run -a python3 tests/test_linux_surface_tab_reentrant_close.py

      - name: Test session load diagnostics and fallback
        run: dbus-run-session -- xvfb-run -a python3 tests/test_linux_session_loading.py

      - name: Test asynchronous browser lifecycle and focus
        run: dbus-run-session -- xvfb-run -a python3 tests/test_linux_browser_lifecycle.py

      - name: Run unit tests
        timeout-minutes: 10
        run: cargo test --workspace

      - name: Test local listener attribution
        run: dbus-run-session -- xvfb-run -a python3 tests/test_linux_ports.py

      - name: Test browser address editing focus
        run: dbus-run-session -- xvfb-run -a cargo test --bin cmux-app browser_address_editing_tracks_delegated_focus -- --ignored --test-threads=1

      - name: Test idle browser preview widget cleanup
        run: dbus-run-session -- xvfb-run -a cargo test --bin cmux-app destroyed_picture_releases_delivery -- --ignored --test-threads=1

      - name: Test asynchronous DevTools snapshot delivery and cancellation
        run: dbus-run-session -- xvfb-run -a cargo test --bin cmux-app devtools_snapshot_delivery_and_cancellation -- --ignored --test-threads=1

      - name: Test divider recovery mapping and lifetime
        run: dbus-run-session -- xvfb-run -a cargo test --bin cmux-app divider_recovery_mapping_and_lifetime -- --ignored --test-threads=1
      - name: Test window state restoration
        run: dbus-run-session -- xvfb-run -a python3 tests/test_linux_window_state.py

      - name: Test final session save on immediate quit
        run: dbus-run-session -- xvfb-run -a python3 tests/test_linux_session_quit.py

      - name: Test manual resume in its owning terminal
        run: dbus-run-session -- xvfb-run -a python3 tests/test_linux_resume.py

      - name: Test installed Claude session hook lifecycle
        run: dbus-run-session -- xvfb-run -a python3 tests/test_linux_claude_hooks.py

      - name: Test installed Codex session hook lifecycle
        run: dbus-run-session -- xvfb-run -a python3 tests/test_linux_codex_hooks.py

      - name: Test nested JSON agent hook lifecycles
        run: dbus-run-session -- xvfb-run -a python3 tests/test_linux_json_agent_hooks.py

      - name: Test installed OpenCode lifecycle plugin
        run: dbus-run-session -- xvfb-run -a python3 tests/test_linux_opencode_hooks.py

      - name: Test installed Cursor lifecycle hooks
        run: dbus-run-session -- xvfb-run -a python3 tests/test_linux_cursor_hooks.py

      - name: Test installed Pi lifecycle extension
        run: dbus-run-session -- xvfb-run -a python3 tests/test_linux_pi_hooks.py

      - name: Test Claude Teams native split translation
        run: dbus-run-session -- xvfb-run -a python3 tests/test_linux_claude_teams.py

      - name: Test signed resume approval and automatic PTY restart
        run: dbus-run-session -- xvfb-run -a python3 tests/test_linux_resume_approval.py

      - name: Test notification history and exact terminal routing
        run: dbus-run-session -- xvfb-run -a python3 tests/test_linux_notifications.py
      - name: Workspace sidebar status and progress
        run: dbus-run-session -- xvfb-run -a python3 tests/test_linux_sidebar_metadata.py
      - name: Atomic workspace batch reorder
        run: dbus-run-session -- xvfb-run -a python3 tests/test_linux_workspace_reorder_many.py
      - name: Automatic local Git metadata
        run: dbus-run-session -- xvfb-run -a python3 tests/test_linux_git_metadata.py
      - name: Desktop notification action routing
        run: dbus-run-session -- xvfb-run -a python3 tests/test_linux_desktop_notifications.py
      - name: Caller notification attribution
        run: dbus-run-session -- xvfb-run -a python3 tests/test_linux_notification_caller.py
      - name: Native scrollback capture
        run: dbus-run-session -- xvfb-run -a python3 tests/test_linux_scrollback.py
      - name: Native session scrollback replay
        run: dbus-run-session -- xvfb-run -a python3 tests/test_linux_scrollback_restore.py
      - name: Previous session recovery
        run: dbus-run-session -- xvfb-run -a python3 tests/test_linux_previous_session.py

      - name: Test native OSC notification bursts and chunk assembly
        run: dbus-run-session -- xvfb-run -a python3 tests/test_linux_osc_notifications.py

      - name: Test process diagnostics and request correlation
        run: dbus-run-session -- xvfb-run -a python3 tests/test_linux_diagnostics.py

      - name: Test per-terminal working directory reports
        run: dbus-run-session -- xvfb-run -a python3 tests/test_linux_surface_directories.py

      - name: Test sibling surface close selection
        run: dbus-run-session -- xvfb-run -a python3 tests/test_close_surface_selection.py
      - name: Test workspace close selection
        run: dbus-run-session -- xvfb-run -a python3 tests/test_close_workspace_selection.py

      - name: Test persistent workspace groups
        run: dbus-run-session -- xvfb-run -a python3 tests/test_workspace_groups.py

      - name: Test nested terminal routing and cleanup
        run: dbus-run-session -- xvfb-run -a python3 tests/test_linux_nested_split_routing.py

      - name: Test prompt diagnostic against GTK
        run: dbus-run-session -- xvfb-run -a python3 tests/test_linux_prompt_probe.py

      - name: Test initial terminal input before submission
        run: dbus-run-session -- xvfb-run -a python3 tests/test_linux_initial_input.py

      - name: Test keyboard routing across workspaces
        run: dbus-run-session -- xvfb-run -a python3 tests/test_multi_workspace_focus.py
      - name: Test workspace widget cleanup
        if: ${{ !cancelled() && steps.debug_build.outcome == 'success' }}
        run: dbus-run-session -- xvfb-run -a cargo test --bin cmux-app workspace_controls_release_closed_widget_trees -- --ignored --test-threads=1

      - name: Test terminal memory and PTY cleanup under churn
        env:
          CMUX_CHURN_REPORT: target/benchmarks/memory-churn.json
        if: ${{ !cancelled() && steps.debug_build.outcome == 'success' }}
        run: dbus-run-session -- xvfb-run -a -s '-screen 0 1920x1200x24' python3 tests/test_linux_memory_churn.py

      - name: Test Linux clipboard, keybinding and paste routing
        if: ${{ !cancelled() && steps.debug_build.outcome == 'success' }}
        run: dbus-run-session -- xvfb-run -a env GDK_BACKEND=x11 LIBGL_ALWAYS_SOFTWARE=1 cargo test --bin cmux-app linux_clipboard_shortcuts_primary_and_surface_routing -- --ignored --test-threads=1

      - name: Setup Go for SSH integration fixture
        if: ${{ !cancelled() && steps.debug_build.outcome == 'success' }}
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version-file: daemon/remote/go.mod

      - name: Build remote integration daemon
        if: ${{ !cancelled() && steps.debug_build.outcome == 'success' }}
        working-directory: daemon/remote
        run: go build -o ../../target/cmuxd-remote ./cmd/cmuxd-remote

      - name: Install SSH integration dependencies
        if: ${{ !cancelled() && steps.debug_build.outcome == 'success' }}
        run: sudo apt-get install -y openssh-server

      - name: Test script and SSH workspace launch and restore
        if: ${{ !cancelled() && steps.debug_build.outcome == 'success' }}
        run: dbus-run-session -- xvfb-run -a python3 tests/test_linux_workspace_launch.py

      - name: Build optimized benchmark executables
        run: cargo build --release --bin cmux --bin cmux-app

      - name: Benchmark optimized CLI to GTK round trips
        env:
          CMUX_BIN_DIR: target/release
          CMUX_BENCHMARK_OUT: target/benchmarks/cli-round-trip.json
        run: dbus-run-session -- xvfb-run -a python3 tests/test_linux_diagnostics.py

      - name: Benchmark optimized terminal memory and redraw churn
        timeout-minutes: 5
        env:
          CMUX_BIN_DIR: target/release
          CMUX_EXPECT_PROFILE: release
          CMUX_CHURN_REPORT: target/benchmarks/memory-churn-release.json
        run: dbus-run-session -- xvfb-run -a -s '-screen 0 1920x1200x24' python3 tests/test_linux_memory_churn.py

      - name: Benchmark optimized background input and bell attention
        timeout-minutes: 5
        run: dbus-run-session -- xvfb-run -a python3 tests/test_linux_attention_benchmark.py

      - name: Benchmark optimized SSH workspace lifecycle
        timeout-minutes: 5
        env:
          CMUX_BIN_DIR: target/release
          CMUX_EXPECT_PROFILE: release
          CMUX_SSH_REPORT: target/benchmarks/ssh-workspaces-release.json
        run: dbus-run-session -- xvfb-run -a python3 tests/test_linux_workspace_launch.py

      - name: Benchmark optimized history input before and after workspace churn
        timeout-minutes: 5
        run: dbus-run-session -- xvfb-run -a python3 tests/test_linux_history_benchmark.py

      - name: Setup Node for real browser integration
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: Install pinned external browser benchmark tools
        timeout-minutes: 5
        run: |
          npm install --prefix target/browser-tools --no-audit --no-fund agent-browser@0.31.1
          target/browser-tools/node_modules/.bin/agent-browser install --with-deps
          echo "$PWD/target/browser-tools/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Benchmark optimized real browser DOM and preview
        timeout-minutes: 5
        run: dbus-run-session -- xvfb-run -a python3 tests/test_linux_real_browser_benchmark.py

      - name: Verify remote browser resources through isolated SSH namespaces
        timeout-minutes: 5
        env:
          CMUX_BIN_DIR: target/release
          CMUX_EXPECT_PROFILE: release
          CMUX_REMOTE_BROWSER: '1'
          CMUX_SSH_REPORT: target/benchmarks/remote-browser-release.json
        run: dbus-run-session -- xvfb-run -a python3 tests/test_linux_workspace_launch.py

      - name: Preserve benchmark results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cmux-benchmarks-${{ github.sha }}
          path: target/benchmarks/
          if-no-files-found: ignore
