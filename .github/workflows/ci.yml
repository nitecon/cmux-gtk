name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  remote-daemon-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: daemon/remote/go.mod

      - name: Run remote daemon tests
        working-directory: daemon/remote
        run: go test ./...

      - name: Validate remote daemon release assets
        run: ./tests/test_remote_daemon_release_assets.sh

  linux-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Test package validation helpers
        run: |
          bash tests/test_package_validation.sh
          bash tests/test_release_version.sh

      - name: Identify Ghostty build cache
        id: ghostty_revision
        run: echo "revision=$(git rev-parse HEAD:ghostty)" >> "$GITHUB_OUTPUT"

      - name: Restore Ghostty build cache
        id: ghostty_cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .tools
            ghostty/.zig-cache
            ghostty/zig-out
            ~/.cache/zig
          key: ghostty-${{ runner.os }}-${{ runner.arch }}-${{ steps.ghostty_revision.outputs.revision }}-${{ hashFiles('scripts/setup-linux*.sh') }}

      - name: Install Linux dependencies and build Ghostty
        run: ./scripts/setup-linux-dev.sh

      - name: Save Ghostty build cache
        if: steps.ghostty_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .tools
            ghostty/.zig-cache
            ghostty/zig-out
            ~/.cache/zig
          key: ${{ steps.ghostty_cache.outputs.cache-primary-key }}

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Check workspace
        run: cargo check --workspace --bins

      - name: Check platform services without GTK
        run: cargo check -p cmux-platform --no-default-features

      - name: Clippy correctness and suspicious lints
        run: cargo clippy --workspace --bins -- -D clippy::correctness -D clippy::suspicious

      - name: Build debug binaries
        id: debug_build
        run: cargo build --workspace --bins

      - name: Test version flags without a display or socket
        run: python3 tests/test_cli_version_flag.py

      - name: Test Python tooling and fixture helpers
        run: |
          python3 tests/test_socket_discovery.py
          python3 tests/test_cli_socket_autodiscovery.py
          python3 tests_v2/test_cli_support.py
          python3 tests/test_socket_transport.py
          python3 tests/test_python_client.py
          python3 tests/test_benchmark_report.py
          python3 tests/test_benchmark_comparison.py
          python3 tests/test_diagnostic_collector.py
          python3 tests/test_process_support.py
          python3 tests/test_sidebar_support.py
          python3 tests/test_render_report_output.py

      - name: Test prompt probe cleanup
        run: python3 tests/test_prompt_probe.py

      - name: Install headless UI test dependencies
        run: sudo apt-get install -y xvfb dbus-x11 openbox xdotool wmctrl x11-utils

      - name: Test terminal pane close lifecycle
        run: dbus-run-session -- xvfb-run -a python3 tests/test_linux_terminal_pane_close.py

      - name: Test CLI closed-pipe and output-error handling
        run: dbus-run-session -- xvfb-run -a python3 tests/test_cli_sigpipe_ignore.py

      - name: Test Linux socket access boundaries
        run: dbus-run-session -- xvfb-run -a python3 tests/test_socket_access.py

      - name: Test unfocused terminal SIGINT delivery
        run: dbus-run-session -- xvfb-run -a python3 tests/test_linux_terminal_sigint.py

      - name: Test surface tab close with browser mapping
        run: dbus-run-session -- xvfb-run -a python3 tests/test_linux_surface_tab_reentrant_close.py

      - name: Test session load diagnostics and fallback
        run: dbus-run-session -- xvfb-run -a python3 tests/test_linux_session_loading.py

      - name: Test asynchronous browser lifecycle and focus
        run: dbus-run-session -- xvfb-run -a python3 tests/test_linux_browser_lifecycle.py

      - name: Run unit tests
        run: cargo test --workspace

      - name: Test idle browser preview widget cleanup
        run: dbus-run-session -- xvfb-run -a cargo test --bin cmux-app destroyed_picture_releases_delivery -- --ignored --test-threads=1

      - name: Test asynchronous DevTools snapshot delivery and cancellation
        run: dbus-run-session -- xvfb-run -a cargo test --bin cmux-app devtools_snapshot_delivery_and_cancellation -- --ignored --test-threads=1

      - name: Test divider recovery mapping and lifetime
        run: dbus-run-session -- xvfb-run -a cargo test --bin cmux-app divider_recovery_mapping_and_lifetime -- --ignored --test-threads=1
      - name: Test window state restoration
        run: dbus-run-session -- xvfb-run -a python3 tests/test_linux_window_state.py

      - name: Test process diagnostics and request correlation
        run: dbus-run-session -- xvfb-run -a python3 tests/test_linux_diagnostics.py

      - name: Test per-terminal working directory reports
        run: dbus-run-session -- xvfb-run -a python3 tests/test_linux_surface_directories.py

      - name: Test sibling surface close selection
        run: dbus-run-session -- xvfb-run -a python3 tests/test_close_surface_selection.py
      - name: Test workspace close selection
        run: dbus-run-session -- xvfb-run -a python3 tests/test_close_workspace_selection.py

      - name: Test keyboard routing across workspaces
        run: dbus-run-session -- xvfb-run -a python3 tests/test_multi_workspace_focus.py
      - name: Test workspace widget cleanup
        if: ${{ !cancelled() && steps.debug_build.outcome == 'success' }}
        run: dbus-run-session -- xvfb-run -a cargo test --bin cmux-app workspace_controls_release_closed_widget_trees -- --ignored --test-threads=1

      - name: Test terminal memory and PTY cleanup under churn
        env:
          CMUX_CHURN_REPORT: target/benchmarks/memory-churn.json
        if: ${{ !cancelled() && steps.debug_build.outcome == 'success' }}
        run: dbus-run-session -- xvfb-run -a -s '-screen 0 1920x1200x24' python3 tests/test_linux_memory_churn.py

      - name: Test Linux clipboard, keybinding and paste routing
        if: ${{ !cancelled() && steps.debug_build.outcome == 'success' }}
        run: dbus-run-session -- xvfb-run -a env GDK_BACKEND=x11 LIBGL_ALWAYS_SOFTWARE=1 cargo test --bin cmux-app linux_clipboard_shortcuts_primary_and_surface_routing -- --ignored --test-threads=1

      - name: Setup Go for SSH integration fixture
        if: ${{ !cancelled() && steps.debug_build.outcome == 'success' }}
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version-file: daemon/remote/go.mod

      - name: Build remote integration daemon
        if: ${{ !cancelled() && steps.debug_build.outcome == 'success' }}
        working-directory: daemon/remote
        run: go build -o ../../target/cmuxd-remote ./cmd/cmuxd-remote

      - name: Install SSH integration dependencies
        if: ${{ !cancelled() && steps.debug_build.outcome == 'success' }}
        run: sudo apt-get install -y openssh-server

      - name: Test script and SSH workspace launch and restore
        if: ${{ !cancelled() && steps.debug_build.outcome == 'success' }}
        run: dbus-run-session -- xvfb-run -a python3 tests/test_linux_workspace_launch.py

      - name: Build optimized benchmark executables
        run: cargo build --release --bin cmux --bin cmux-app

      - name: Benchmark optimized CLI to GTK round trips
        env:
          CMUX_BIN_DIR: target/release
          CMUX_BENCHMARK_OUT: target/benchmarks/cli-round-trip.json
        run: dbus-run-session -- xvfb-run -a python3 tests/test_linux_diagnostics.py

      - name: Preserve benchmark results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cmux-benchmarks-${{ github.sha }}
          path: target/benchmarks/
          if-no-files-found: ignore
