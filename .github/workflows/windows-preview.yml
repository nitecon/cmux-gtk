name: Windows builds and releases

on:
  push:
    branches: [main, feature/windows-native]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      verify_run:
        description: Existing preview run to smoke-check without rebuilding (optional)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: windows-preview-${{ github.ref }}-${{ inputs.verify_run || 'build' }}
  cancel-in-progress: false

jobs:
  windows-native:
    if: ${{ !inputs.verify_run }}
    permissions:
      contents: write
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          $version = [regex]::Match((Get-Content Cargo.toml -Raw), '(?m)^version = "([^"]+)"').Groups[1].Value
          if (-not $version -or $env:GITHUB_REF_NAME -ne "v$version") { throw 'Release version mismatch' }

      - name: Select native Rust MSVC toolchain
        run: rustup toolchain install stable-x86_64-pc-windows-msvc --profile minimal

      - name: Restore native build cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .tools/native
            .tools/vcpkg-cache
            .tools/downloads
            .tools/zig-*
            .tools/libclang
            ghostty/.zig-cache
            ghostty/zig-out
            target
          key: windows-msvc-${{ hashFiles('Cargo.lock', 'scripts/setup-windows.ps1', 'build_support/windows/**', '.gitmodules') }}-${{ github.sha }}
          restore-keys: |
            windows-msvc-${{ hashFiles('Cargo.lock', 'scripts/setup-windows.ps1', 'build_support/windows/**', '.gitmodules') }}-
            windows-msvc-

      - name: Prepare MSVC GTK and build Ghostty terminal backend
        id: terminal_backend
        run: . ./scripts/setup-windows.ps1

      - name: Cache completed native terminal backend
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .tools/native
            .tools/vcpkg-cache
            .tools/downloads
            .tools/zig-*
            .tools/libclang
            ghostty/.zig-cache
            ghostty/zig-out
            target
          key: windows-msvc-${{ hashFiles('Cargo.lock', 'scripts/setup-windows.ps1', 'build_support/windows/**', '.gitmodules') }}-${{ github.sha }}

      - name: Build Windows CMUX binaries
        env:
          CMUX_RELEASE_BUILD: ${{ startsWith(github.ref, 'refs/tags/v') && '1' || '0' }}
        run: cargo build --workspace --bins --release --locked

      - name: Test native Windows storage and pipe boundaries
        run: cargo test -p cmux-platform --no-default-features --features async-io --locked

      - name: Test verified native Windows update archives
        run: |
          cargo test --bin cmux updater:: --locked

      - name: Prepare real actor client and native provider fixture
        shell: pwsh
        env:
          ACTOR_CLIENT_REVISION: af92179ed831b3076c1334e4395c670eff245806
          CARGO_TARGET_DIR: ${{ github.workspace }}/target/actor-client-build
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force target/actor-client | Out-Null
          if (-not (Test-Path target/actor-client-source/.git)) {
            git init target/actor-client-source
            git -C target/actor-client-source remote add origin https://github.com/nitecon/agent-tools.git
          }
          git -C target/actor-client-source fetch --depth=1 origin $env:ACTOR_CLIENT_REVISION
          if ($LASTEXITCODE) { throw 'Actor client source fetch failed' }
          git -C target/actor-client-source checkout --detach FETCH_HEAD
          if ($LASTEXITCODE) { throw 'Actor client checkout failed' }
          & "$env:USERPROFILE/.cargo/bin/cargo.exe" build --locked --release --manifest-path target/actor-client-source/Cargo.toml -p agent-cli --bin agent-tools
          if ($LASTEXITCODE) { throw 'Native actor client compilation failed' }

      - name: Compile native provider fixture
        run: cl.exe /nologo /W4 /O2 /utf-8 tests/fixtures/windows_actor_agent.c /Fetarget/actor-client/codex.exe /Fotarget/actor-client/codex.obj

      - name: Fetch verified official Codex for native queue acceptance
        run: python scripts/fetch-codex-fixture.py target/codex-fixture --platform windows

      - name: Bundle portable preview
        id: bundle
        run: python scripts/package-windows.py --prefix "$env:CMUX_GTK_PREFIX" --runtime-dir "$env:CMUX_MSVC_RUNTIME_DIR" --archive dist/cmux-gtk-windows-x86_64.zip

      - name: Prepare isolated software OpenGL for hosted-runner acceptance
        run: . ./scripts/setup-windows-software-gl.ps1

      - name: Test portable preview startup and terminal RPC
        run: |
          $actorClient = (Resolve-Path target/actor-client-build/release/agent-tools.exe).Path
          $actorFixture = (Resolve-Path target/actor-client/codex.exe).Path
          $codexFixture = (Get-Content target/codex-fixture/executable.txt -Raw).Trim()
          python tests/windows-preview-smoke.py target/windows-preview --software-gl-dir "$env:CMUX_SOFTWARE_GL_DIR" --actor-client $actorClient --actor-fixture $actorFixture --codex-fixture $codexFixture

      - name: Test portable Windows updater
        env:
          CMUX_VERSION: 0.0.1
          CMUX_UPDATE_TEST_API: http://127.0.0.1:50127/release
          CMUX_RELEASE_BUILD: '0'
        run: |
          cargo build --release --bin cmux --locked
          if ($LASTEXITCODE) { throw 'Updater fixture build failed' }
          python scripts/test_windows_updater.py --bundle target/windows-preview --client target/release/cmux.exe --archive dist/cmux-gtk-windows-x86_64.zip

      - name: Upload Windows release archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cmux-gtk-windows-x86_64
          path: |
            dist/cmux-gtk-windows-x86_64.zip
            dist/cmux-gtk-windows-x86_64.zip.sha256
          if-no-files-found: error

      - name: Cache compiled native application and test dependencies
        if: always() && !cancelled()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .tools/native
            .tools/vcpkg-cache
            .tools/downloads
            .tools/zig-*
            .tools/libclang
            ghostty/.zig-cache
            ghostty/zig-out
            target
          key: windows-msvc-${{ hashFiles('Cargo.lock', 'scripts/setup-windows.ps1', 'build_support/windows/**', '.gitmodules') }}-${{ github.sha }}-compiled

      - name: Publish Windows GitHub release assets
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          gh release view $env:GITHUB_REF_NAME *> $null
          if ($LASTEXITCODE) {
            gh release create $env:GITHUB_REF_NAME --verify-tag --generate-notes
            if ($LASTEXITCODE) {
              # Linux publication may have created the same release concurrently.
              gh release view $env:GITHUB_REF_NAME
              if ($LASTEXITCODE) { throw 'GitHub release creation failed' }
            }
          }
          gh release upload $env:GITHUB_REF_NAME dist/cmux-gtk-windows-x86_64.zip dist/cmux-gtk-windows-x86_64.zip.sha256 --clobber
          if ($LASTEXITCODE) { throw 'Windows release asset upload failed' }

      - name: Upload Windows preview
        if: always() && steps.bundle.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cmux-windows-x86_64-preview
          path: target/windows-preview/
          if-no-files-found: error

      - name: Collect build logs on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-preview-build-evidence
          if-no-files-found: ignore
          path: |
            ghostty/zig-out/include/ghostty.h
            target/release/build/cmux-gtk-*/output

  verify-preview:
    if: ${{ inputs.verify_run != '' }}
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout smoke script
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Download built preview
        id: download
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PREVIEW_BUILD_RUN: ${{ inputs.verify_run }}
        run: gh run download $env:PREVIEW_BUILD_RUN --name cmux-windows-x86_64-preview --dir target/windows-preview

      - name: Install software OpenGL for the hosted runner
        run: . ./scripts/setup-windows-software-gl.ps1

      - name: Test portable preview startup and terminal RPC
        run: |
          python scripts/fetch-codex-fixture.py target/codex-fixture --platform windows
          if ($LASTEXITCODE) { throw 'Codex fixture download failed' }
          $codexFixture = (Get-Content target/codex-fixture/executable.txt -Raw).Trim()
          python tests/windows-preview-smoke.py target/windows-preview --software-gl-dir "$env:CMUX_SOFTWARE_GL_DIR" --codex-fixture $codexFixture

      - name: Upload preview with runtime evidence
        if: always() && steps.download.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cmux-windows-x86_64-preview
          path: target/windows-preview/
          if-no-files-found: error
